- type: entity
  id: WeaponDSM32A1
  suffix: DeadSector, Gun, Sir_Felix
  name: Гранатомёт М32А1
  description: .
  parent: [ BaseItem, BaseGunWieldable, BaseMinorContraband ]
  components:
  - type: EmitSoundOnPickup
    sound:
      collection: RiflesPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: RiflesDrop
  - type: EmitSoundOnLand
    sound:
      collection: RiflesDrop
  - type: Sprite
    sprite: _Aquila/EventContent/Sir_Felix/DeadSector/Firearms/Guns/granedlauncher/M32A1-gun/M32A1.rsi
    layers:
    - state: bolt-open
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Item
    sprite: _Aquila/EventContent/Sir_Felix/DeadSector/Firearms/Guns/granedlauncher/M32A1-gun/M32A1-inhand.rsi
    size: Large
    shape:
    - 0,0,3,1
  - type: Clothing
    sprite: _Aquila/EventContent/Sir_Felix/DeadSector/Firearms/Guns/granedlauncher/M32A1-gun/M32A1-inhand.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: GunRequiresWield
  - type: SpeedModifiedOnWield
    walkModifier: 0.75
    sprintModifier: 0.75
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Aquila/EventContent/Sir_Felix/DeadSector/Firearms/47.ogg
  - type: BallisticAmmoProvider
    capacity: 5
    proto: CartridgeDSM32A1Grenade
    whitelist:
      tags:
      - CartridgeM32A1
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: Appearance

