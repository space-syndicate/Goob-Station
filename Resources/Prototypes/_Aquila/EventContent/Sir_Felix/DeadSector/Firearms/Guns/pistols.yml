- type: entity
  id: WeaponDSDesertEagle
  suffix: DeadSector, Gun, Sir_Felix
  name: Desert Eagle
  description: .
  parent: [ BaseItem, BaseMinorContraband ]
  components:
  - type: EmitSoundOnPickup
    sound:
      collection: PistolsPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: PistolsDrop
  - type: EmitSoundOnLand
    sound:
      collection: PistolsDrop
  - type: Sprite
    sprite: _Aquila/EventContent/Sir_Felix/DeadSector/Firearms/Guns/pistols/Deagle-gun/Deagle.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Item
    sprite: _Aquila/EventContent/Sir_Felix/DeadSector/Firearms/Guns/pistols/Deagle-gun/Deagle-inhand.rsi
    size: Small
  - type: Clothing
    sprite: _Aquila/EventContent/Sir_Felix/DeadSector/Firearms/Guns/pistols/Deagle-gun/Deagle-inhand.rsi
    quickEquip: false
    slots:
    - Belt
  - type: AmmoCounter
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Aquila/EventContent/Sir_Felix/DeadSector/Firearms/12.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/pistol_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineDSDesertEagle
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineDSDesertEagle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeDS357
        priority: 1
        whitelist:
          tags:
          - CartridgeDS357
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

