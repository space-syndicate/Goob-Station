- type: entity
  id: WeaponDSMk48
  suffix: DeadSector, Gun, Sir_Felix
  name: Mk48
  description: .
  parent: [ BaseItem, BaseGunWieldable, BaseMinorContraband, BaseAttachmentsGun ]
  components:
  - type: EmitSoundOnPickup
    sound:
      collection: RiflesPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: RiflesDrop
  - type: EmitSoundOnLand
    sound:
      collection: RiflesDrop
  - type: Sprite
    sprite: _Aquila/EventContent/Sir_Felix/DeadSector/Firearms/Guns/machingun/Mk48-gun/Mk48.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
      visible: false
  - type: Item
    sprite: _Aquila/EventContent/Sir_Felix/DeadSector/Firearms/Guns/machingun/Mk48-gun/Mk48-inhand.rsi
    size: Huge
    shape:
    - 0,0,3,2
  - type: Clothing
    sprite: _Aquila/EventContent/Sir_Felix/DeadSector/Firearms/Guns/machingun/Mk48-gun/Mk48-inhand.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: GunRequiresWield
  - type: SpeedModifiedOnWield
    walkModifier: 0.65
    sprintModifier: 0.65
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 3
    pvsIncrease: 0.3
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -20
  - type: Gun
    fireRate: 6
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/_Aquila/EventContent/Sir_Felix/DeadSector/Firearms/42.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineDSMk48
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineDSMk48
      gun_chamber:
        name: Chamber
        startingItem: CartridgeDS7x62x51
        priority: 1
        whitelist:
          tags:
          - CartridgeDS7x62x51
      gun_attachment_right:
        name: gun-attachment-slot-right
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: -2
        whitelist:
          tags:
            - AttachmentRight
  - type: ContainerContainer
    containers:
      gun_attachment_right: !type:ContainerSlot
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

