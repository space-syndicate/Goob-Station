- type: entity
  id: WeaponDSPSL
  suffix: DeadSector, Gun, Sir_Felix
  name: PSL
  description: .
  parent: [ BaseItem, BaseGunWieldable, BaseMinorContraband, BaseAttachmentsGun ]
  components:
  - type: Sprite
    sprite: _Aquila/EventContent/Sir_Felix/DeadSector/Firearms/Guns/rifles/PSL/PSL.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
      visible: false
  - type: Item
    sprite: _Aquila/EventContent/Sir_Felix/DeadSector/Firearms/Guns/rifles/PSL/PSL-inhand.rsi
    size: Huge
    shape:
    - 0,0,3,2
  - type: Clothing
    sprite: _Aquila/EventContent/Sir_Felix/DeadSector/Firearms/Guns/rifles/PSL/PSL-inhand.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: GunRequiresWield
  - type: SpeedModifiedOnWield
    walkModifier: 0.70
    sprintModifier: 0.70
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 3
    pvsIncrease: 0.3
  - type: GunWieldBonus
    minAngle: -21
    maxAngle: -32
  - type: Gun
    fireRate: 0.4
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Aquila/EventContent/Sir_Felix/DeadSector/Firearms/38.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineDSPSL
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineDSPSL
      gun_chamber:
        name: Chamber
        startingItem: CartridgeDS7x62x54
        priority: 1
        whitelist:
          tags:
          - CartridgeDS7x62x54
      gun_attachment_right:
        name: gun-attachment-slot-right
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: -2
        whitelist:
          tags:
            - AttachmentRight
  - type: ContainerContainer
    containers:
      gun_attachment_right: !type:ContainerSlot
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

