- type: entity
  parent: BasePlatformWood
  id: PlatformWoodSide
  name: railing
  description: Basic railing meant to protect idiots like you from falling.
  components:
  - type: Construction
    graph: PlatformWoodGraph
    node: side
  - type: Sprite
    state: side
  - type: Icon
    state: side
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.25"
        density: 1000
        mask:
        - TableMask
        layer:
        - TableLayer

