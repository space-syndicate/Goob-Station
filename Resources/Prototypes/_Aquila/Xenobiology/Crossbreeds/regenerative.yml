- type: entity
  parent: BaseSlimeCrossbreedRegenerative
  id: CrossbreedRegenerativeGrey
  name: regenerative grey extract
  description: Squeeze it over a creature to mend its wounds. Also sates hunger and thirst.
  components:
  - type: Sprite
    layers:
    - state: core
      color: "#828282"
    - state: regenerative
  - type: RegenerativeCrossbreed
    effects:
    - !type:NestedEffect
      proto: XenobioRegenerativeHeal
    - !type:SatiateHunger
      factor: 50
    - !type:SatiateThirst
      factor: 50

