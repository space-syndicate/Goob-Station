- type: entity
  parent: BasePDACartridge
  id: BankCartridge
  name: bank cartridge
  description: A program for managing a personal bank account.
  components:
  - type: Sprite
    state: cart-y
  - type: UIFragment
    ui: !type:BankUi
  - type: Cartridge
    programName: bank-program-name
    icon:
      sprite: _Aquila/Interface/Misc/program_icons.rsi
      state: bank
  - type: BankCartridge
    approvers:
    - Captain
    - HeadOfPersonnel
    - HeadOfSecurity
    - ChiefEngineer
    - ChiefMedicalOfficer
    - ResearchDirector
    - Quartermaster
    authorities:
    - job: Magistrate
      budget: Security
      bonusLimit: 0
      unlimitedFine: true
      revokeFines: true
    - access: Captain
      budget: Cargo
      bonusLimit: 600
      maxFine: 400
      revokeFines: true
    - access: HeadOfPersonnel
      budget: Service
      bonusLimit: 400
      maxFine: 300
    - access: HeadOfSecurity
      budget: Security
      maxFine: 300
    - access: ChiefEngineer
      budget: Engineering
    - access: ChiefMedicalOfficer
      budget: Medical
    - access: ResearchDirector
      budget: Science
    - access: Quartermaster
      budget: Cargo
