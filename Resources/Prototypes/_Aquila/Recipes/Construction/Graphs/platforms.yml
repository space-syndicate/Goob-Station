- type: constructionGraph
  id: PlatformWoodGraph
  start: start
  graph:
  - node: start
    edges:
    - to: side
      completed:
      - !type:SnapToGrid { }
      steps:
      - material: WoodPlank
        amount: 2
        doAfter: 2
    - to: corner
      completed:
      - !type:SnapToGrid { }
      steps:
      - material: WoodPlank
        amount: 3
        doAfter: 2.5
    - to: cornerSmall
      completed:
      - !type:SnapToGrid { }
      steps:
      - material: WoodPlank
        amount: 1
        doAfter: 2

  - node: side
    entity: PlatformWoodSide
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: MaterialWoodPlank1
        amount: 2
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2

  - node: corner
    entity: PlatformWoodCorner
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: MaterialWoodPlank1
        amount: 3
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2

  - node: cornerSmall
    entity: PlatformWoodCornerSmall
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: MaterialWoodPlank1
        amount: 1
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2

