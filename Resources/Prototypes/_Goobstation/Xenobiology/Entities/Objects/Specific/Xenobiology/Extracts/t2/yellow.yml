- type: entity
  id: YellowSlimeExtract
  parent: BaseSlimeExtract
  name: yellow slime extract
  components:
  - type: Sprite
    layers:
    - sprite: _Goobstation/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#ffff1a"
  - type: Reactive
    reactions:
    - reagents: [ Water ]
      methods: [ Touch, Injection ]
      effects:
      # Aquila Change start
      - !type:NestedEffect
        proto: XenobioExtractReaction
      - !type:RelayNearby
        compName: Battery
        range: 5
        effect: !type:RechargeBattery
          fraction: 0.5
      - !type:PlaySoundEffect
        sound: /Audio/Effects/sparks4.ogg
      # Aquila Change end
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractReaction
      - !type:SpawnEntity
        entity: XenobioVolatileOrgan
        number: 1
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractReaction
      # Aquila Change start
      - !type:Emp
        rangeModifier: 5
        maxRange: 5
      # Aquila Change end
  - type: Tag
    tags:
    - XenobiologyYellowExtract
