- type: entity
  id: MetalSlimeExtract
  parent: BaseSlimeExtract
  name: metal slime extract
  components:
  - type: Sprite
    layers:
    - sprite: _Goobstation/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#595959"
      shader: XenoMetallic
  - type: Reactive
    reactions:
    - reagents: [ Water ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractReaction
      # Aquila Change start
      - !type:SpawnEntity
        entity: SheetGlass10
        number: 2
      - !type:SpawnEntity
        entity: SheetRGlass1
        number: 10
      # Aquila Change end
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractReaction
      # Aquila Change start
      - !type:SpawnEntity
        entity: SheetSteel10
        number: 2
      - !type:SpawnEntity
        entity: SheetPlasteel10
      # Aquila Change end
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      # Aquila Change start
      - !type:NestedEffect
        proto: XenobioExtractReaction
      - !type:SpawnEntity
        entity: XenobioSlimeArmorPlate
      # Aquila Change end
  - type: Tag
    tags:
    - XenobiologyMetalExtract
