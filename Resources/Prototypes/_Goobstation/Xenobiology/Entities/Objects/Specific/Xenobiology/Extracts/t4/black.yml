- type: entity
  id: BlackSlimeExtract
  parent: BaseSlimeExtract
  name: black slime extract
  components:
  - type: Sprite
    layers:
    - sprite: _Goobstation/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#000000"
  - type: Reactive
    reactions:
    - reagents: [ Water ]
      methods: [ Touch, Injection ]
      effects:
      # Aquila Change start
      - !type:NestedEffect
        proto: XenobioExtractEvil
      - !type:Jitter
        time: 3
        frequency: 20
      - !type:SpawnEntity
        entity: XenobioSlimeRareSpawner
      # Aquila Change end
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractReagent
      - !type:RelaySolution
        name: extract
        effects:
        - !type:AdjustReagent
          reagent: AdvancedMutationToxin
          amount: 10
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      # Aquila Change start
      - !type:NestedEffect
        proto: XenobioExtractReaction
      - !type:SpawnEntity
        entity: XenobioCommonExtractSpawner
        number: 2
      # Aquila Change end
  - type: Tag
    tags:
    - XenobiologyBlackExtract
