# Medical borg
- type: borgType
  id: medical

  # Description
  dummyPrototype: BorgChassisMedical

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleMedical

  defaultModules:
  - BorgModuleTool # Imperial Space: Add BorgModuleTool
  - BorgModulePrying
  - BorgModuleChemical
  - BorgModuleTopicals
  - BorgModuleRescue # Imperial Space Ребаланс боргов (добавлен модуль дефиба)
  - BorgModuleAdvancedTopical # Imperial Space Ребаланс боргов (добавлен модуль гипоспрея)
  - BorgModuleSurgeryTools # Imperial Space хирургия

  radioChannels:
  - Science
  - Medical

  addComponents:
  # Imperial Space: add action. start
  - type: CrewMonitoringConsole
  # Must re-add after MapInit RemoveComponents; keep robotics console frequencies.
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: CyborgControl
    transmitFrequencyId: RoboticsConsole
    savableAddress: false
  - type: WirelessNetworkConnection
    range: 500
  - type: StationLimitedNetwork
  - type: UserInterface
    interfaces:
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
        requireInputValidation: false
      enum.BorgUiKey.Key:
        type: BorgBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.BorgSwitchableTypeUiKey.SelectBorgType:
        type: BorgSelectTypeUserInterface
      enum.CrewMonitoringUIKey.Key:
        type: CrewMonitoringBoundUserInterface
  - type: IntrinsicUI
    uis:
      enum.CrewMonitoringUIKey.Key:
        toggleAction: ActionShowCrewMonitor
  # Imperial Space: add action. end
  - type: SolutionScanner
  - type: Stripping # Imperial Space: add ability to search
  - type: ShowHealthBars
    damageContainers:
    - Biological
  - type: ShowHealthIcons
    damageContainers:
    - Biological

  # Visual
  inventoryTemplateId: borgDutch
  spriteBodyState: medical
  spriteBodyMovementState: medical_moving
  spriteHasMindState: medical_e
  spriteNoMindState: medical_e_r
  spriteToggleLightState: medical_l

  # Pet
  petSuccessString: petting-success-medical-cyborg
  petFailureString: petting-failure-medical-cyborg

  # Sounds
  footstepCollection:
    collection: FootstepHoverBorg


