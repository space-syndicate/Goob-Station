- type: entity
  name: Standard hypospray
  parent: BaseItem
  description: A tool for doctors to quickly administer medications.
  id: StandardHypospray
  components:
  - type: Sprite
    sprite: Imperial/Stellark/standarthypo.rsi
    layers:
    - state: hypo
      map: ["enum.SolutionContainerLayers.Base"]
    - state: hypo_fill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: Imperial/Stellark/standarthypo.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 15
  - type: RefillableSolution
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
    exactVolume: true
  - type: Hypospray
    onlyAffectsMobs: false
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: hypo_fill
    solutionName: hypospray
  - type: CustomHypospray
    injectionDelayTime: 1.0
  - type: StaticPrice
    price: 1000

- type: entity
  id: CrateChemistryStandartHypo
  parent: CrateMedical
  name: storage box for standard hyposprays
  description: A box filled with two standard hyposprays
  components:
  - type: StorageFill
    contents:
      - id: StandardHypospray
        amount: 2
