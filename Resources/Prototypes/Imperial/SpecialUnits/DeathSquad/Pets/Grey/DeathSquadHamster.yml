- type: entity
  parent:
  - MobSiliconBase
  - ShowMedicalIcons
  - StripableInventoryBase
  id: MobHamsterDeathSquad
  name: Grey
  description: A mechanical copy of the universally beloved Hamlet. Moreover, a decent doctor.
  suffix: DeathSquad
  components:
  - type: Sprite
    drawdepth: SmallMobs
    sprite: Imperial/SpecialUnits/DeathSquad/Pets/Grey/death_squad_hamster.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: hamster
  - type: Appearance
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: petting-success-dshamster
    interactFailureString: petting-failure-dshamster
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/fox_squeak.ogg
  - type: Inventory
    speciesId: hamster
    templateId: hamster
  - type: DoAfter
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: ghost-role-information-dshamster-name
    description: ghost-role-information-dshamster-description
    rules: ghost-role-information-dshamster-rules
  - type: GhostTakeoverAvailable
  - type: Tag
    tags:
    - CannotSuicide
    - Hamster
    - VimPilot
    - ChefPilot
    - CanPilot
  - type: ComplexInteraction
  - type: CrewSkills #Да-да, маленький хомячок умеет все)
    groups: [All]
  - type: Access #Доступы тоже.
    groups:
    - AllAccess
    tags:
    - CentralCommand
    - DeathSquad
  - type: IntrinsicRadioTransmitter
    channels:
    - SODDeathSquad
    - CentCom
    - Common
    - Command
    - Engineering
    - Medical
    - Science
    - Security
    - Service
    - Supply
  - type: ActiveRadio
    channels:
    - SODDeathSquad
    - CentCom
    - Common
    - Command
    - Engineering
    - Medical
    - Science
    - Security
    - Service
    - Supply
  - type: ZombieImmune
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 120
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed : 3.5
    baseSprintSpeed : 5.5
  - type: DamageStateVisuals
    states:
      Alive:
        Base: hamster
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: CanEscapeInventory
    baseResistTime: 1
  - type: MobPrice
    price: 30000
  - type: NonSpreaderZombie
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Mouse_burning
  - type: Hands
    activeHandId: Right
    hands:
      Right:
        location: Right
      Left:
        location: Left
      Medical:
        location: Left
    sortedHands:
    - Right
    - Left
    - Medical
  - type: CombatMode
  - type: NoSlip
  - type: Item
    size: Tiny
  - type: Physics
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: AutoImplant
    implants:
    - MindShieldImplant
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      160: Dead
  - type: ShowHealthBars
    damageContainers:
    - Silicon
  - type: HealthExaminable
    examinableTypes:
      - Blunt
      - Slash
      - Piercing
      - Heat
      - Shock
    locPrefix: silicon
  - type: Repairable
    doAfterDelay: 10
    allowSelfRepair: false
  - type: Puller
    needsHands: false
  - type: Loadout
    prototypes: [ DeathSquadHamsterInstrumental ]
#hud
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons
  - type: ShowContrabandDetails

- type: entity
  name: Grey hypospray # Кастомный гипоспрей Грея
  parent: BaseItem
  description: A sterile injector for rapid administration of drugs to patients.
  id: HyposprayGrey
  categories: [ HideSpawnMenu ]
  components:
  - type: Unremoveable
  - type: Sprite
    sprite: Imperial/SpecialUnits/DeathSquad/Pets/Grey/hypo.rsi
    state: borghypo
  - type: Item
    sprite: Imperial/SpecialUnits/DeathSquad/Pets/Grey/hypo.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 30
  - type: RefillableSolution
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
  - type: Injector
    solutionName: hypospray
    currentTransferAmount: 5
    activeModeProtoId: HyposprayInjectMode
    popupOnInjectFail: false
    allowedModes:
    - HyposprayInjectMode
  - type: UseDelay
    delay: 0.5
  - type: StaticPrice
    price: 11750
  - type: BorgHypo
    solutions:
      - reagents:
        - reagentId: Bicaridine
          quantity: 1
          sprite: /Textures/Imperial/Other/BorgHypoIcons/brutekit.png
      - reagents:
        - reagentId: Dermaline
          quantity: 1
          sprite: /Textures/Imperial/Other/BorgHypoIcons/burnkit.png
      - reagents:
        - reagentId: Dexalin
          quantity: 1
          sprite: /Textures/Imperial/Other/BorgHypoIcons/o2kit.png
      - reagents:
        - reagentId: Inaprovaline
          quantity: 1
          sprite: /Textures/Imperial/Other/BorgHypoIcons/firstaid.png
      - reagents:
        - reagentId: Hyronalin
          quantity: 1
          sprite: /Textures/Imperial/Other/BorgHypoIcons/radkit.png
      - reagents:
        - reagentId: Dylovene
          quantity: 1
          sprite: /Textures/Imperial/Other/BorgHypoIcons/toxinkit.png
      - reagents:
        - reagentId: Omnizine
          quantity: 1
          sprite: /Textures/Imperial/Other/BorgHypoIcons/advkit.png
  - type: SolutionRegeneration
    solution: hypospray
    generated:
      reagents:
        - ReagentId: Bicaridine
          Quantity: 1

- type: entity
  id: GreyDefibrillatorCompact
  parent: BaseDefibrillator
  name: Grey's compact defibrillator
  description: Now in fun size!
  categories: [ HideSpawnMenu ]
  components:
  - type: Unremoveable
  - type: Sprite
    sprite: Imperial/SpecialUnits/DeathSquad/Pets/Grey/defib.rsi
    layers:
      - state: icon
      - state: screen
        map: [ "enum.ToggleableVisuals.Layer" ]
        visible: false
        shader: unshaded
      - state: ready
        map: ["enum.PowerDeviceVisualLayers.Powered"]
        shader: unshaded
  - type: Item
    size: Normal
#  - type: ToggleCellDraw
#  - type: PowerCellDraw
#    useRate: 0
  - type: Defibrillator
    zapHeal:
      types:
        Asphyxiation: -40
    doAfterDuration: 6
  - type: DoAfter
  - type: UseDelay
#  - type: ItemSlots
#    slots:
#      cell_slot:
#        name: power-cell-slot-component-slot-name-default
#        startingItem: PowerCellHyper

- type: entity
  id: GreyHealthAnalyzer
  parent: HandheldHealthAnalyzer
  categories: [ HideSpawnMenu ]
  components:
  - type: Unremoveable
  - type: Sprite
    sprite: Imperial/SpecialUnits/DeathSquad/Pets/Grey/analyzer.rsi
    state: icon
    layers:
      - state: icon
      - state: analyzer
        shader: unshaded
        visible: true
        map: [ "enum.PowerDeviceVisualLayers.Powered" ]

- type: startingGear
  id: DeathSquadHamsterInstrumental
  equipment:
    suitstorage: OxygenTankFilled
  inhand:
  - HyposprayGrey
  - GreyDefibrillatorCompact
  - GreyHealthAnalyzer
