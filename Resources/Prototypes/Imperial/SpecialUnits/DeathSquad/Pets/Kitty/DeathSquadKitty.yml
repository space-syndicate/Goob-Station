#DeathSquad kitty
- type: entity
  name: deathcat
  id: MobCatDeathSquad
  parent: MobCat
  description: Stroke him properly and maybe he won't rip your head off...
  suffix: DeathSquad
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/SpecialUnits/DeathSquad/Pets/Kitty/deathsquad_kitty.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: deathcat_alive
    - map: [ "mask" ]
  - type: Grammar
    attributes:
      proper: true
      gender: male
  - type: ActionGrant
    actions:
    - ActionGiveEClaws
  - type: Inventory
    speciesId: cat
    templateId: deathsquadcat
  - type: DamageStateVisuals
    states:
      Alive:
        Base: deathcat_alive
      Critical:
        Base: deathcat_dead
      Dead:
        Base: deathcat_dead
  - type: GhostRole
    prob: 1
    name: ghost-role-information-dscat-name
    allowMovement: true
    description: ghost-role-information-dscat-description
    rules: ghost-role-information-dscat-rules
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: StandingState
  - type: RotationVisuals
    defaultRotation: 180
    horizontalRotation: 180
  - type: AutoImplant
    implants:
    - MindShieldImplant
    - EmpImplant
  - type: NpcFactionMember
    factions:
    - DeathSquad
  - type: MeleeWeapon
    attackRate: 1
    altDisarm: false
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Slash: 15
  - type: ComplexInteraction
  - type: Access #Доступы тоже.
    groups:
    - AllAccess
    tags:
    - CentralCommand
    - DeathSquad
  - type: IntrinsicRadioReceiver #Радио также прифигачино прямо в моба.
  - type: IntrinsicRadioTransmitter
    channels:
    - SODDeathSquad
    - CentCom
    - Common
    - Command
    - Engineering
    - Medical
    - Science
    - Security
    - Service
    - Supply
  - type: ActiveRadio
    channels:
    - SODDeathSquad
    - CentCom
    - Common
    - Command
    - Engineering
    - Medical
    - Science
    - Security
    - Service
    - Supply
  - type: ZombieImmune
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown
    - PressureImmunity
    - SlowedDown
    - Stutter
#    - Electrocution #Это тоже можно пофиксить, но я не хочу еще сильнее менять и без того сильно измененого от базовых мобов кота.
#    - ForcedSleep #Я мог бы выдать в темплейт инвентаря голову и аутер клозинг, сделать шлем скафандру, но мне гига лень. Так что котика невозможно усыпить насильно. Живите с этим)
    - TemporaryBlindness
    - Pacified
    - StaminaModifier
#    - Flashed #По аналогии с предыдущеми пунктами. Я вообще был бы рад глобально переработать котиков, и не только. Скафандры им сделать, Синдика поменять. Но для этого надо сильно менять ванильные прототипы.
    - RadiationProtection
    - Drowsiness
    - Adrenaline
  - type: NoSlip
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 5
  - type: Tag
    tags:
      - DoorBumpOpener
      - CanPilot
  - type: MovementAlwaysTouching
  - type: Barotrauma
    protectionSlots:
    - mask
    damage:
      types:
        Blunt: 0.15
  - type: InteractionPopup
    successChance: 0.7
    interactSuccessString: petting-success-deathcat
    interactFailureString: petting-failure-deathcat
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/cat_meow.ogg
  - type: CrewSkills #То самое чувство, когда котенок со своими лапками, и лошадь на ходу остановит, и шаттлом управлять умеет, и товарища вылечить может, и мета наварит, пока ты только в носу ковыряться умеешь...
    groups: [All]
  - type: Puller
    needsHands: false
  - type: Hands
    hands:
      hand_right:
        location: Right
      hand_left:
        location: Left
    sortedHands:
    - hand_right
    - hand_left
#door pry
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
    useSound:
      path: /Audio/Items/crowbar.ogg

- type: entity
  name: deathcat
  id: MobCatDeathSquadEVA
  parent: MobCatDeathSquad
  description: Stroke him properly and maybe he won't rip your head off...
  suffix: DeathSquad
  components:
  - type: Loadout
    prototypes: [ DeathSquadCatLodout ]

- type: startingGear #gear
  id: DeathSquadCatLodout
  equipment:
    mask: CatHardsuitDeathSquad
    suitstorage: OxygenTankFilled

- type: entity
  parent: BaseAction
  id: ActionGiveEClaws
  name: Energy Claws
  description: Activate deadly claws.
  components:
  - type: Action
    useDelay: 2
    raiseOnAction: true
    itemIconStyle: BigAction
    icon:
      sprite: Imperial/SpecialUnits/DeathSquad/Pets/Kitty/deathsquad_kitty_claws.rsi
      state: icon
  - type: InstantAction
    event: !type:OnRetractableItemActionEvent
  - type: RetractableItemAction
    spawnedPrototype: KittyEnergyClaws
    summonSounds:
      collection: GenericHit # Placeholder
    retractSounds:
      collection: GenericHit # Placeholder

- type: entity
  name: energy claws #Лазерные когти
  parent: BaseMeleeWeaponEnergy
  id: KittyEnergyClaws
  categories: [ HideSpawnMenu ]
  description: A very loud & dangerous sw-... claws with a beam made of pure, concentrated plasma. Cat claws?..
  components:
  - type: Sprite
    sprite: Imperial/SpecialUnits/DeathSquad/Pets/Kitty/deathsquad_kitty_claws.rsi ##Imperial/SpecialUnits/DeathSquad/Pets/Kitty/deathsquad_kitty_claws.rsi
    layers:
    - state: e_claws
    - state: e_claws_blade
      color: white
      visible: false
      shader: unshaded
      map: [ "blade" ]
  - type: Item
    sprite: Imperial/SpecialUnits/DeathSquad/Pets/Kitty/deathsquad_kitty_claws_inhands.rsi
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcClaw
    wideAnimationRotation: -135
    attackRate: 2
    damage:
      types:
        Blunt: 5
  - type: ComponentToggler
    components:
    - type: Sharp
    - type: DisarmMalus
      malus: 0.6
    - type: Execution
      doAfterDuration: 4.0
    - type: BonusMeleeDamage
      bonusDamage:
        types:
          Blunt: 5
          Slash: 10
          Heat: 10
          Structural: 40
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/eblade1.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/eblade1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnSwing:
      path: /Audio/Weapons/eblademiss.ogg
      params:
        variation: 0.125
  - type: MultiHandedItem
