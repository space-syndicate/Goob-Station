- type: entity
  parent: BaseAction
  id: ActionEnhancedShot
  name: Enhanced shot
  description: locale
  components:
  - type: Action
    useDelay: 60
    itemIconStyle: BigAction
    icon:
      sprite: Imperial/MiningWeapons/EmpoweredAttacks/charged_shot.rsi
      state: icon
  - type: TargetAction
    range: 60
  - type: WorldTargetAction
    event: !type:EnhancedShotEvent

