- type: entity
  parent: DrinkCanBaseFull
  id: DrinkRedSpace
  name: Red Space Energy
  description: A semi-legal drink made from telesynthet was banned from sale several years ago due to its high content. It is not recommended for newborns, pregnant women, the elderly, or disabled lizard.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: RedSpaceEnergy
          Quantity: 30
  - type: Sprite
    sprite: Imperial/Lilith/Objects/Consumable/Drinks/redspace.rsi
  - type: Item
    sprite: Imperial/Lilith/Objects/Consumable/Drinks/redspace.rsi

- type: entity
  parent: [ DrinkBaseMaterialGlass, DrinkHotCoffee ]
  id: DrinkMilkshakeChocolateGlass
  name: chocolate milkshake
  description: A treat for lovers of that sweet touch of bitterness. The perfect companion for beach days or chocolate ice cream fans.
  suffix: chocolate
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: ChocolateMilkshake
          Quantity: 30
  - type: Icon
    sprite: Imperial/Lilith/Objects/Consumable/Drinks/chocolate.rsi
    state: icon
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: fill-
    changeColor: false
    emptySpriteName: icon_empty
  - type: Sprite
    sprite: Imperial/Lilith/Objects/Consumable/Drinks/chocolate.rsi
    layers:
      - map: ["enum.SolutionContainerLayers.Base"]
        state: icon_empty
      - map: ["enum.SolutionContainerLayers.Fill"]
        state: fill-6

