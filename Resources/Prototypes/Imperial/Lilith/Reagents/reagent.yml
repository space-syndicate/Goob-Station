- type: reagent
  id: Telestizin
  name: reagent-name-telestizin
  group: Narcotics
  desc: reagent-desc-telestizin
  physicalDesc: reagent-physical-desc-exhilarating
  flavor: redspaceenergy
  color: "#D80E22"
  metabolisms:
    Bloodstream:
      effects:
      # Main effects
      - !type:MovementSpeedModifier
        walkSpeedModifier: 1.3
        sprintSpeedModifier: 1.3
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStimulantsStamina # You are on meth. You keep going.
        time: 1
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 1
        type: Remove
      - !type:ModifyKnockdown
        time: 1
        type: Remove
      # Side effects
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Telestizin
          min: 5
      # OD
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Telestizin
          min: 15
        damage:
          types:
            Poison: 3
            Cellular: 0.5
      # Interactions
      - !type:AdjustReagent
        conditions:
        - !type:ReagentCondition
          reagent: ChloralHydrate
          min: 1
        reagent: ChloralHydrate
        amount: -10
      # Side effects
      - !type:ResetNarcolepsy
      - !type:AdjustReagent
        conditions:
        - !type:ReagentCondition
          reagent: Telestizin
          min: 30
        reagent: UnstableBluespaceLiquid
        amount: 1
      - !type:AdjustReagent
        conditions:
        - !type:ReagentCondition
          reagent: Telestizin
          max: 30
        reagent: UnstableBluespaceLiquid
        amount: -10


