- type: entity
  parent: BaseAction
  id: ActionNDA079ToggleVisionMode
  components:
  - type: Action
    useDelay: 1
    icon: { sprite: Imperial/XxRaay/079/actions.rsi, state: AiVision }
    itemIconStyle: BigAction
    checkCanInteract: false
  - type: InstantAction
    event: !type:NDA079ToggleVisionModeEvent

- type: entity
