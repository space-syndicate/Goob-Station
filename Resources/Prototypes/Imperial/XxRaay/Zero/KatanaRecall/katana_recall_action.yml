- type: entity
  parent: BaseAction
  id: ActionKatanaRecall
  name: Возвращение катаны
  description: Возвращает катану в ваши руки, если она находится в пределах досягаемости.
  components:
  - type: Action
    useDelay: 3.0
    icon: Interface/Actions/manifest.png
    checkCanInteract: true
    checkConsciousness: true
    useSound: /Audio/Effects/teleport_departure.ogg
  - type: InstantAction
    event: !type:KatanaRecallActionEvent
