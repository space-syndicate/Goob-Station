- type: entity
  parent: MiningBorgChassisDerelict
  id: MiningBorgChassisDerelictExpedition
  name: derelict salvage cyborg
  description: A man-machine hybrid that assists the cargo department. This one has seen the wrong side of a gibtonite chunk.
  components:
  - type: GhostRole
    name: ghost-role-information-derelict-mining-cyborg-name
    description: ghost-role-information-derelict-mining-cyborg-description
    rules: ghost-role-information-silicon-rules
    raffle:
      settings: default
    reregister: false
    job: Borg
  - type: GhostTakeoverAvailable
  - type: Damageable
    damage:
      types:
        Slash: 60
        Blunt: 90
  - type: Sprite
    layers:
    - state: miner_derelict
      map: ["movement"]
    - state: miner_e_r
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: miner_l
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: miner_moving_derelict
    noMovementLayers:
      movement:
        state: miner_derelict
  - type: BorgChassis
    maxModules: 7
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - BorgModuleCargo
    hasMindState: miner_e
    noMindState: miner_e_r
  - type: ContainerFill
    containers:
      borg_brain:
      - PositronicBrain
      borg_module:
      - BorgModulePrying
      - BorgModuleTool
      - BorgModuleAdvancedMining
      - BorgModuleFaunaPesting
      - BorgModuleScrapSalvage
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
  - type: RandomMetadata
    nameSegments: [NamesBorg]