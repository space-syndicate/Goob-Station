### 3Plushe

- type: entity
  parent: PlushieFumoJunko
  hideSpawnMenu: true
  id: BasePlushieKolontarev
  name: BasePlushieCharacter
  suffix: Kolontarev, COMMUNITY, TOY
  components:
  - type: Sprite
    sprite: Imperial/Other/TFG/Toughguys/IAA.rsi
    state: icon
  - type: Item
    size: Normal
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,0,1
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
