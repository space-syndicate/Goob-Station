- type: reagent #Медицина империал спасе, сами реагенты
  id: Adenosine
  name: reagent-name-adenosine
  group: Medicine
  desc: reagent-desc-adenosine
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#71bd85"
  metabolisms:
    Bloodstream:
      effects:
      - !type:EvenHealthChange
        damage:
          Brute: -0.25 #В случае введения системы органов должно будет лечить сердце, ведь инозин доставляет миокардам дополнительные пищевые клетки.
          Airloss: -1
      - !type:HealthChange
        damage:
          types:
            Poison: -0.1
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Adenosine
          min: 11
        damage:
          types:
            Blunt: 0.33333334
            Slash: 0.33333334
            Piercing: 0.33333334
            Asphyxiation: 0.5
            Bloodloss: 0.5
            Poison: 0.2

