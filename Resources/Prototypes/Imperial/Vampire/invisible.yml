- type: entity
  parent: BaseAction
  id: VampireInvisibleAction
  name: Переключить режим невидимости
  description: Делает вампира невидимым за счёт 2 ед. крови в секунду. Любая атака/урон прерывает эффект.
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    icon:
      sprite: Imperial/Stellark/Vampire/actions.rsi
      state: invisible
  - type: InstantAction
    event: !type:VampireInvisibleEvent
      costBlood: 2 # в секунду
