- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseVampireObjective
  components:
  - type: Objective
    issuer: objective-issuer-vampire
    difficulty: 1
  - type: RoleRequirement
    roles:
    - VampireRole

- type: weightedRandom
  id: VampireObjectiveGroups
  weights:
    VampireObjectiveGroupSteal: 1

- type: weightedRandom
  id: VampireObjectiveGroupSteal
  weights:
    VampireBibleStealObjective: 1
    VampireWardenHatStealObjective: 1
    VampireForensicScannerStealObjective: 1
    VampireCMOHyposprayStealObjective: 1
    VampireCorgiMeatStealObjective: 1
    VampireFireAxeStealObjective: 1
    VampireCaptainSwordStealObjective: 0.5
    VampireHandTeleporterStealObjective: 0.5
    VampireEnergyMagnumStealObjective: 0.5
    VampireNukeDiskStealObjective: 0.3

- type: entity
  parent: [BaseVampireObjective, BaseKillObjective]
  id: VampireKillRandomPersonObjective
  description: Сделайте это как считаете нужным, главное чтобы он не попал на станцию ЦентКома
  components:
  - type: Objective
    difficulty: 1.75
    unique: false
  - type: TargetObjective
    title: objective-condition-maroon-person-title
  - type: PickRandomPerson
    filters:
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
  - type: KillPersonCondition
    requireMaroon: true

- type: entity
  parent: BaseVampireObjective
  id: VampireDrinkBloodObjective
  components:
  - type: Objective
    icon:
      sprite: Imperial/Stellark/Vampire/purposes.rsi
      state: drink_blood
  - type: NumberObjective
    min: 250
    max: 300
    title: objective-condition-blood-title
    description: objective-condition-blood-description
  - type: VampireDrinkBloodPurposes

