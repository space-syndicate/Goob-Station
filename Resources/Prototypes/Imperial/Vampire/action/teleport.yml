- type: entity
  parent: BaseAction
  id: VampireTeleportAction
  name: Телепорт
  description: Телепортирует на короткую дистанцию, оставляя облако дыма на месте отправления.
  components:
  - type: Action
    useDelay: 15
    itemIconStyle: BigAction
    icon:
      sprite: Imperial/Stellark/Vampire/actions.rsi
      state: teleport
  - type: InstantAction
    event: !type:VampireTeleportEvent
      costBlood: 20
