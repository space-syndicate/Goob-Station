- type: entity
  parent: BaseAction
  id: VampireTransformBloodAction
  name: Превращение в лужу крови
  description: На 4 секунды превращает вас в кровь, позволяя проходить сквозь препятствия.
  components:
  - type: Action
    useDelay: 25
    itemIconStyle: BigAction
    icon:
      sprite: Imperial/Stellark/Vampire/actions.rsi
      state: transform_blood
  - type: InstantAction
    event: !type:VampireBloodTransformEvent
      costBlood: 20
