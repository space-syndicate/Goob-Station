- type: entity
  parent: BaseAction
  id: VampireNosferatyAction
  name: Гнев Носферату
  description: На 25 секунд в 2 раза больше урона, +50% скорости атаки, +50% скорости передвижения. Стоимость 15 ед. крови. Кулдаун 40 секунд.
  components:
  - type: Action
    useDelay: 40
    itemIconStyle: BigAction
    icon:
      sprite: Imperial/Stellark/Vampire/actions.rsi
      state: nosferaty
  - type: InstantAction
    event: !type:VampireNosferatyEvent
      costBlood: 15

- type: entity
  parent: BaseAction
  id: VampireNosferatyPlusAction
  name: Гнев Носферату +
  description: На 25 секунд +40% урона, +15% скорости атаки, +20% скорости передвижения.  Стоимость 0 ед. крови. Кулдаун 10 секунд.
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    icon:
      sprite: Imperial/Stellark/Vampire/actions.rsi
      state: nosferaty_plus
  - type: InstantAction
    event: !type:VampireNosferatyEvent
      costBlood: 0
