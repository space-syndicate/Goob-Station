- type: entity
  parent: BaseAction
  id: VampireShadowTrapAction
  name: Теневой капкан
  description: Устанавливает ловушку. При срабатывании ослепляет жертву и наносит 20 урона. Исчезает через 10 секунд под светом.
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    icon:
      sprite: Imperial/Stellark/Vampire/actions.rsi
      state: shadow_trap_icon
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:VampireShadowTrapEvent
      costBlood: 20

- type: entity
  parent: BaseLandMine
  id: VampireTrap
  name: Теневой капкан
  description: При срабатывании ослепляет жертву и наносит 20 урона. Исчезает через 10 секунд под светом.
  components:
  - type: Transform
    anchored: True
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: InteractionOutline
  - type: Sprite
    sprite: Imperial/Stellark/Vampire/trap.rsi
    layers:
      - state: shadow_trap
  - type: VampireTrapOnTrigger
    damage: 35
  - type: Fixtures
    fixtures:
      fix:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        mask:
        - Impassable
        layer:
        - Impassable
        hard: false
