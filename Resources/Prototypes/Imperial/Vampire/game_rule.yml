- type: entity
  parent: BaseGameRule
  id: Vampire
  noSpawn: true
  components:
  - type: AntagRandomObjectives
    sets:
    - groups: VampireObjectiveGroups
    maxDifficulty: 1
  - type: AntagObjectives
    objectives:
    - VampireDrinkBloodObjective
    - VampireKillRandomPersonObjective
    # - VampireConvertedGhoulsObjective
    - VampireEscapeShuttleObjective
  - type: GameRule
  - type: VampireRole
  - type: DynamicRuleCost
    cost: 150
  - type: AntagSelection
    agentName: vampire-round-end-agent-name
    definitions:
    - prefRoles: [ Vampire ]
      max: 3
      lateJoinAdditional: true
      allowNonHumans: false
      blacklist:
        components:
        - AntagImmune
        - BibleUser
      briefing:
        text: vampire-role-greeting-human
        color: "#8B0000"
        sound: /Audio/Ambience/Antag/vampire_start.ogg
      components:
      - type: CrewSkills # Imperial Space Crew SKills
        groups: [All]
        fakeGroups: [Base]
        overrideMindSkills: true
      - type: Vampire
      mindRoles:
      - MindRoleVampire
