- type: entity
  name: supermatter monitor console
  parent: BaseWallmountMachine
  id: SupermatterMonitorConsole
  description: A console that displays the exact integrity of the nearest supermatter crystal.
  components:
  - type: ActivatableUI
    requiresComplex: true
    key: enum.SupermatterConsoleUiKey.Key
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
          params:
            volume: -4
  - type: DeviceLinkSink
  - type: Icon
    sprite: Imperial/ussp/computers.rsi
    state: comm_monitor
  - type: PowerConsumer
    drawRate: 10
    voltage: 120
  - type: Speech
    speechSounds: Pai
  - type: Sprite
    sprite: Imperial/ussp/computers.rsi
    state: comm_monitor
  - type: SupermatterConsole
  - type: UserInterface
    interfaces:
      enum.SupermatterConsoleUiKey.Key:
        type: SupermatterConsoleBoundUserInterface
