# CARP
- type: entity
  parent: RehydratableAnimalCube
  id: SafeCarpCube
  name: carp cube (20s)
  components:
  - type: Rehydratable
    possibleSpawns:
    - SafeCarpSpawner

- type: entity
  id: BaseSafeSpawner20s
  abstract: true
  components:
  - type: TimedDespawn
    lifetime: 20
  - type: InteractionOutline
  - type: Clickable
  - type: Sprite
    sprite: Imperial/Xenogenetics/ammorph.rsi
    state: icon
  - type: Transform
  - type: Damageable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: SafeCarpSpawner
  name: SafeCarpSpawner
  parent: BaseSafeSpawner20s
  components:
  - type: SpawnOnDespawn
    prototype: MobCarp

# SPACE BEAR
- type: entity
  parent: RehydratableAnimalCube
  id: SafeSpaceBearCube
  name: sapce bear cube (20s)
  components:
  - type: Rehydratable
    possibleSpawns:
    - SafeSpaceBearSpawner

- type: entity
  id: SafeSpaceBearSpawner
  name: SafeSpaceBearSpawner
  parent: BaseSafeSpawner20s
  components:
  - type: SpawnOnDespawn
    prototype: MobBearSpace