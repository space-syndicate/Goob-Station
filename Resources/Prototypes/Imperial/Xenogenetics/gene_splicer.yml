- type: entity
  name: gene splicer
  parent: BaseItem
  id: ImperialGeneSplicerBase
  description: Jesse, insert that catgirl gene into yourself Jesse
  components:
  - type: Appearance
  - type: Sprite
    sprite: Imperial/Xenogenetics/splicer.rsi
    layers:
    - state: icon
    - state: gene-inserted
      map: [ gene ]
      visible: false
  - type: UseDelay
    delay: 0.9
  - type: Item
    sprite: Objects/Devices/gps.rsi
  - type: ContainerContainer
    containers:
      gene_slot: !type:ContainerSlot {}
  - type: ItemSlots
    slots:
      gene_slot:
        name: gene-slot-name
        whitelist:
          components:
            - XenoGene
        priority: 3
  - type: ItemMapper
    spriteLayers:
    - gene
    mapLayers:
      gene:
        whitelist:
          components:
            - XenoGene
  - type: GeneSplicer