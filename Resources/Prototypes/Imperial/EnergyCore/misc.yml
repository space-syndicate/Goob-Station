## Debug
- type: entity
  name: debug core gun
  parent: BaseWeaponBattery
  id: WeaponDebugCoreGun
  description: desc
  suffix: EnergyCore, Debug
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
  - type: Item
    storedOffset: 0,-3
  - type: Gun
    fireRate: 5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: Appearance
  - type: ProjectileBatteryAmmoProvider
    proto: BulletLaserCoreHeater
    fireCost: 150
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletLaserCoreHeater
      fireCost: 100
    - proto: BulletLaserCoreCooler
      fireCost: 100
    - proto: BulletLaserCoreTempChangerRising
      fireCost: 100
    - proto: BulletLaserCoreTempChangerDecreasing
      fireCost: 100
  - type: Tag
    tags:
    - Sidearm
  - type: Battery
    maxCharge: 300
    startingCharge: 300
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 100

- type: entity
  name: laser bolt
  id: BulletLaserCore
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: heavylaser
      shader: unshaded
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.28,-0.28,0.28,0.28"
        hard: false
        layer: [None]
        mask:
        - Opaque
        - FullTileMask
  - type: Ammo
  - type: Projectile
    deleteOnCollide: false
    impactEffect: BulletImpactEffectOrangeDisabler
    damage:
      types:
        Heat: 0
  - type: TimedDespawn
    lifetime: 1

- type: entity
