##PDA ID

#Pilot NT ID
- type: entity
  parent: IDCardStandard
  id: ERTPilotIDCard
  name: ERT pilot ID card
  components:
  - type: Sprite
    sprite: Objects/Misc/id_cards.rsi
    layers:
      - state: centcom
  - type: IdCard
    jobTitle: Пилот ОБР
    jobIcon: JobIconNanotrasen      # иконка N над головой
    jobPrototype: ERTSecurity       # опционально: берём департаменты из этого джоба
  - type: Access
    tags:
    - CentralCommand
    - EmergencyShuttleRepealAll
    - Captain
    - HeadOfPersonnel
    - ChiefEngineer
    - ChiefMedicalOfficer
    - HeadOfSecurity
    - ResearchDirector
    - Command
    - Cryogenics
    - Security
    - Detective
    - Armory
    - Brig
    - Lawyer
    - Engineering
    - Medical
    - Quartermaster
    - Salvage
    - Cargo
    - Research
    - Service
    - Maintenance
    - External
    - Janitor
    - Theatre
    - Bar
    - Chemistry
    - Kitchen
    - Chapel
    - Hydroponics
    - Atmospherics
    - GenpopEnter
    - GenpopLeave

