##Preset Role

#Security NT
- type: entity
  parent: MobHuman
  id: ERTStormtrooperTDMPreset
  name: ERT Stormtrooper
  components:
    - type: RandomMetadata
      nameSegments:
      - NamesLast
    - type: Sprite
      netsync: false
      sprite: Markers/jobs.rsi
      state: ertsecurityeva
    - type: Loadout
      prototypes: [ ERTStormtrooperGearTDM ]
    - type: RandomHumanoidAppearance
      randomizeName: false
    - type: AutoImplant
      implants:
      - MindShieldImplant
    - type: GhostTakeoverAvailable # Для корректной работы ТТС
    - type: GhostRole
      name: ert-stormtrooper-tdm-name
      description: ert-stormtrooper-tdm-desc
      rules: ert-stormtrooper-tdm-rules
      raffle:
        settings: short

