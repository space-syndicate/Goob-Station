# Антенна

- type: entity
  id: FelixAntenna
  parent: BaseStructure
  name: antenna
  description: Transmits and receives some kind of radio signal.
  suffix: DeadSector, Structure
  components:
  - type: Sprite
    sprite: Imperial/DeimonFly/Felix/Structures/antenna.rsi
    state: animation
    noRot: true
    offset: 0,0.25
  - type: Icon
    sprite: Imperial/DeimonFly/Felix/Structures/antenna.rsi
    state: icon
  - type: AmbientSound
    range: 3
    volume: -5
    sound:
      path: /Audio/Imperial/Asimov/Oldradio/static.ogg
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: MetalThud
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 8
            max: 8
          CableApcStack1:
            min: 1
            max: 1
          PartRodMetal1:
            min: 2
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# Баррикады. Слои коллизии блокируют персонажей, но намеренно пропускают снаряды.

- type: entity
  id: BaseFelixBarricade
  parent: BaseStructure
  name: barricade
  description: An improvised defensive structure.
  suffix: DeadSector, Structure
  abstract: true
  components:
  - type: Sprite
    drawdepth: BlastDoors
    noRot: false
    snapCardinals: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.35,0.49,0.35"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: FelixBarricadeSandy
  parent: BaseFelixBarricade
  name: sandy barricade
  description: An improvised defensive structure made from sandbags.
  components:
  - type: Sprite
    sprite: Imperial/DeimonFly/Felix/Structures/barricade_sandy.rsi
    layers:
    - state: bags5
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        bags4: ""
        bags5: ""

- type: entity
  id: FelixBarricadeSnowy
  parent: BaseFelixBarricade
  name: snowy barricade
  description: An improvised defensive structure made from frozen sandbags.
  components:
  - type: Sprite
    sprite: Imperial/DeimonFly/Felix/Structures/barricade_snowy.rsi
    layers:
    - state: bags5
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        bags4: ""
        bags5: ""

- type: entity
  id: FelixBarricadeMetal
  parent: BaseFelixBarricade
  name: metal barricade
  description: A low barricade assembled from metal posts.
  components:
  - type: Sprite
    sprite: Imperial/DeimonFly/Felix/Structures/barricade_metal.rsi
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.35,0.49,0.35"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: MetalBarricadeDamageModifierSet
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

