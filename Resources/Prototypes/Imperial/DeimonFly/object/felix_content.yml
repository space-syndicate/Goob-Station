# Сопротивление металлической баррикады

- type: damageModifierSet
  id: MetalBarricadeDamageModifierSet
  coefficients:
    Piercing: 0.5

# Взрывчатка и средства связывания

- type: entity
  id: FelixC4
  parent: C4
  name: C-4 explosive
  description: 150,000 tons of TNT.
  suffix: Felix, Weapons
  components:
  - type: Sprite
    sprite: Imperial/DeimonFly/Felix/Bombs/felix_c4.rsi
    state: icon
    layers:
    - state: icon
      map: ["base"]
  - type: TimerTrigger
    keysIn:
    - trigger
    - stuck
    delay: 10
    delayOptions: [10, 30, 60, 120, 300, 600, 900]
    initialBeepDelay: 0
    beepSound: /Audio/Machines/Nuke/general_beep.ogg

- type: entity
  id: FelixRopeCuffs
  parent: Handcuffs
  name: rope restraints
  description: Improvised disposable restraints made from sturdy rope.
  suffix: Felix
  components:
  - type: Item
    size: Small
    storedRotation: 90
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#8B6F47"
      right:
      - state: inhand-right
        color: "#8B6F47"
  - type: Handcuff
    breakoutTime: 3
    cuffedRSI: Objects/Misc/cablecuffs.rsi
    bodyIconState: body-overlay
    color: "#8B6F47"
    breakOnRemove: true
    brokenPrototype: FelixRopeCuffsBroken
    startCuffSound:
      path: /Audio/Items/Handcuffs/rope_start.ogg
    endCuffSound:
      path: /Audio/Items/Handcuffs/rope_end.ogg
    startUncuffSound:
      path: /Audio/Items/Handcuffs/rope_start.ogg
    endUncuffSound:
      path: /Audio/Items/Handcuffs/rope_breakout.ogg
    startBreakoutSound:
      path: /Audio/Items/Handcuffs/rope_takeoff.ogg
  - type: Sprite
    sprite: Objects/Misc/cablecuffs.rsi
    state: cuff
    color: "#8B6F47"

- type: entity
  id: FelixRopeCuffsBroken
  parent: BaseHandcuffsBroken
  name: torn rope restraints
  description: Torn rope that will no longer restrain anyone.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Misc/cablecuffs.rsi
    state: cuff-broken
    color: "#8B6F47"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#8B6F47"
      right:
      - state: inhand-right
        color: "#8B6F47"

# Деревья

- type: entity
  id: FelixBlackTreeSmall
  parent: BaseTree
  name: small black tree
  description: A small tree with blackened bark and dark foliage.
  suffix: DeadSector, Structure
  components:
  - type: Sprite
    sprite: Imperial/DeimonFly/Felix/Structures/black_tree_small.rsi
    state: small
    noRot: true
    drawdepth: Overdoors
    offset: 0,1

- type: entity
  id: FelixBlackTreeLarge
  parent: BaseTree
  name: large black tree
  description: A huge tree with blackened bark and dark foliage.
  suffix: DeadSector, Structure
  components:
  - type: Sprite
    sprite: Imperial/DeimonFly/Felix/Structures/black_tree_large.rsi
    state: large
    noRot: true
    drawdepth: Overdoors
    offset: 0,2

- type: entity
  id: FelixBlackTreeAnimated
  parent: BaseTree
  name: moving black tree
  description: Its branches move slowly even in still air.
  suffix: DeadSector, Structure
  components:
  - type: Sprite
    sprite: Imperial/DeimonFly/Felix/Structures/black_tree_animated.rsi
    state: animated
    noRot: true
    drawdepth: Overdoors
