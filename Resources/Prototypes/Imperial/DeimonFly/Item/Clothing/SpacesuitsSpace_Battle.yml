#Leader
- type: entity
  parent: ClothingOuterHardsuitERTLeader
  id: ClothingOuterHardsuitERTLeaderSpaceBattle
  name: captain’s battle voidsuit
  description: A fortified command voidsuit for flotilla captains parade-grade presence with plated armor, encrypted comms, and magboots so the skipper never abandons ship.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.3      # 70%
        Slash: 0.3      # 70%
        Piercing: 0.25  # 75%
        Heat: 0.4       # 60%
        Radiation: 0.25 # 75%
        Caustic: 0.35   # 65%
  - type: ExplosionResistance
    damageCoefficient: 0.5   # 50%
  - type: StaminaResistance
    damageCoefficient: 0.4   # 60%
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.6  # 40%
  - type: ClothingSpeedModifier
    walkModifier: 0.9   # дебаф 10%
    sprintModifier: 0.9

#Warrion
- type: entity
  parent: ClothingOuterHardsuitERTSecurityAlternative
  id: ClothingOuterHardsuitERTSecuritySpaceBattle
  name: assault trooper battle suit
  description: A reinforced assault voidsuit for frontline breaches trades comfort for plating and sealed joints, just enough life support to finish the job.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.4        # 60%
        Slash: 0.4        # 60%
        Piercing: 0.3     # 70%
        Heat: 0.5         # 50%
        Radiation: 1      # нет защиты
        Caustic: 1        # нет защиты
  - type: ExplosionResistance
    damageCoefficient: 0.55  # ~45% взрывного урона
  - type: StaminaResistance
    damageCoefficient: 0.5   # 50% выносливости
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.75  # 25% защита от заражения
  - type: ClothingSpeedModifier
    walkModifier: 0.9       # дебаф скорости 10%
    sprintModifier: 0.9

