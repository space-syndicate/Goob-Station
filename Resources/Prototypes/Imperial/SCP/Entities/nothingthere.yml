- type: entity
  name: nothing there
  suffix: seriozha, Недра, Ham Maggotson
  parent: [ ImperialSCPBase, StripableInventoryBase ]
  id: ImperialSCPNothingThere
  description: Hello?
  components:
    - type: Sprite
      drawdepth: Mobs
      scale: "0.75, 0.75"
      layers:
      - map: [ "enum.DamageStateVisualLayers.Base" ]
        state: jared
        sprite: Imperial/SCP/nothingthere1.rsi
    - type: MobThresholds
      thresholds:
        0: Alive
        2000: Dead
    - type: MovementSpeedModifier
      baseWalkSpeed: 3.2
      baseSprintSpeed: 2.8
    - type: Puller
    - type: Pullable
    - type: Tag
      tags:
      - DoorBumpOpener
      - FootstepSound
    - type: Access
      tags:
      - SCPAccesOne
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.4
          density: 300
          mask:
          - MobMask
          layer:
          - MobLayer
    - type: ImperialSCPChaseMusic
      chaseSound:
        path: /Audio/Imperial/Seriozha/SCP/chase/chase1.ogg
        params:
          volume: -2
          range: 10
    - type: ImperialNothingThere
      empowerDamage:
        types:
          Blunt: 110
      threshold: 200
    - type: MeleeWeapon
      hidden: true
      altDisarm: false
      soundHit:
        path: /Audio/Imperial/SCP/nothingthere_punch1.ogg
      angle: 0
      animation: WeaponArcClaw
      damage:
        types:
          Blunt: 45
    - type: FootstepModifier
      footstepSoundCollection:
        collection: FootstepNothingThere
    - type: Speech
      speechVerb: LargeMob
      allowedEmotes: ['Scream']
    - type: Vocal
      sounds:
        Male: NothingThere
        Unsexed: NothingThere
        Female: NothingThere

- type: soundCollection
  id: FootstepNothingThere
  files:
  - /Audio/Imperial/SCP/nothingthere_run1.ogg

- type: emoteSounds
  id: NothingThere
  sound:
    path: /Audio/Imperial/SCP/nothingthere_scream.ogg

