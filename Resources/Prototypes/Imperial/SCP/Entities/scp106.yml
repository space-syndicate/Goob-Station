      shader: unshaded
      map: ["base"]
  - type: SCP106
    inDimension: true
    firstHitDamage:
      types:
        Poison: 40
    damagePerSecond:
      types:
        Blunt: 1
  - type: Actions
  - type: ContentEye
  - type: Damageable
    damageModifierSet: SCPStandart
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 280
        layer:
        - GhostImpassable
- type: entity
  parent: ImperialSCPDed
  categories: [HideSpawnMenu, DoNotMap]
  id: ImperialSCPDedD
  components:
  - type: SCP106
    inPocketDimension: true
