  name: SCP 106 subdimensional transportation
  description: He is moving closer and closer.
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: Input
    context: "ghost"
  - type: NoFTL
  - type: Tag
    tags:
    - GhostOnlyWarp
  - type: Eye
    pvsScale: 1.5
    drawFov: false
    visMask:
      - Normal
      - Ghost
  - type: Visibility
    layer: 2
  - type: Sprite
    sprite: Imperial/SCP/dimensionscp.rsi
    layers:
