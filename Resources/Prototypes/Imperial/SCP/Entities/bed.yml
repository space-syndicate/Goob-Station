- type: entity
  name: bed
  id: ImperialSCP106Bed
  parent: BaseStructure
  description: This is used to lie in, sleep in or strap on. Resting here provides extremely slow healing.
  components:
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.05"
        density: 190
        mask:
        - TableMask
  - type: Sprite
    sprite: /Textures/Imperial/SCP/bed.rsi
    state: icon
    noRot: true
  - type: Strap
    position: Down
    rotation: -90
  - type: PlaceableSurface
    placeCentered: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Transform
    anchored: true
    noRot: true
  - type: Pullable
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
      - Trigger
  - type: SCP106Bed
    damage:
      types:
        Blunt: 50

- type: entity
  id: ContainmentFieldSCP106
  name: containment field
  parent: ContainmentField
  description: A containment field that repels various entities...
  placement:
    mode: SnapgridCenter
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        - GhostImpassable
        layer:
        - GlassLayer
  - type: ContainmentField
    throwForce: 5

- type: entity
  id: ContainmentFieldGeneratorSCP106
  name: containment field generator
  parent: ContainmentFieldGenerator
  description: Sky buddy
  components:
  - type: ContainmentFieldGenerator
    createdField: ContainmentFieldSCP106
