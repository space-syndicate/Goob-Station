- type: entity
  id: MagazinePistolRubber
  name: pistol magazine (.35R-S auto rubber)
  description: Specialized .35R-S rubber caliber for service pistols. A shortened case, thickened projectile, and non-standard propellant seating make it incompatible with automatic weapons, while still providing a strong stunning effect with controlled lethality.
  parent: BaseMagazinePistol
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolRubber
  - type: Sprite
    sprite: Imperial/Objects/Weapons/Guns/Ammunition/Magazine/Pistol/pistol_mag.rsi
    layers:
    - state: rubber
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: MagazinePistolRubberEmpty
  name: pistol magazine (.35R-S auto any)
  suffix: empty
  parent: BaseMagazinePistol
