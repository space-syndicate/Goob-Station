- type: entity 
  id: MagazinePistolHighCapacityRubberImperial
  name: Expanded pistol magazine (.35R-S auto rubber)
  description: An extended pistol magazine designed for the specialized .35R-S rubber caliber. A lengthened body and double-stack feed allow carrying more rounds with minimal loss of reliability.
  parent: BaseMagazinePistolHighCapacity
  components:
  - type: Tag
    tags:
    - MagazinePistol #Imperial Space restrict to pistol slots
  - type: BallisticAmmoProvider
    proto: CartridgePistolRubber
  - type: Sprite
    sprite: Imperial/Objects/Weapons/Guns/Ammunition/Magazine/Pistol/pistol_high_capacity_mag.rsi
    layers:
    - state: rubber
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

