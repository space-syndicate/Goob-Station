- type: reagent
  id: Phazonium
  name: reagent-name-phazonium
  desc: reagent-desc-phazonium
  physicalDesc: reagent-physical-desc-phazonium
  flavor: bitter
  color: "#4B0082"
  tileReactions:
  - !type:FlammableTileReaction
    temperatureMultiplier: 2.0
  - !type:CreateEntityTileReaction
    entity: BluespaceHoleEffect
  - !type:TeleportTileReaction
    energyPerUnit: 1
    teleportType: Random
  reactiveEffects:
    Flammable:
      methods: [ Touch ]
      effects:
      - !type:Flammable
        multiplier: 0.8
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Radiation: 12
    Respiration:
      effects:
      - !type:HealthChange
        ignoreResistances: true
        damage:
          types:
            Slash: 1
            Blunt: 1
            Heat: 1.5
            Asphyxiation: 1
            Poison: 2
            Piercing: 1
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Phazonium
          min: 1
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 500
        refresh: true
