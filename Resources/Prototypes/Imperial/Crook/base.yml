- type: reagent
  id: AndroidBlood
  name: reagent-name-android-blood
  group: Toxins
  desc: reagent-desc-android-blood
  physicalDesc: reagent-physical-desc-metallic
  flavor: shocking
  color: "#4d7ee7"
  metabolisms:
    Poison:
      effects:
      - !type:Jitter
        conditions:
        - !type:TotalDamageCondition
          min: 5
        - !type:MetabolizerTypeCondition
          type: Android
          shouldHave: false
      - !type:Electrocute
        probability: 0.1
        conditions:
        - !type:MetabolizerTypeCondition
          type: Android
          shouldHave: false
      - !type:HealthChange
        damage:
          groups:
            Airloss: 1
        conditions:
        - !type:MetabolizerTypeCondition
          type: Android
          shouldHave: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceAndroid
  name: android appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganHumanTorso
      Head: OrganHumanHead
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandRight: OrganHumanHandRight
      HandLeft: OrganHumanHandLeft
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
      Brain: AndroidCore
  - type: HumanoidProfile
    species: Human

- type: species
  id: Android
  name: species-name-android
  roundStart: false
  prototype: MobMechanic
  defaultSkinTone: "#b9b199"
  dollPrototype: AppearanceAndroid
  skinColoration: Hues
  maleFirstNames: NamesFirstMale
  femaleFirstNames: NamesFirstFemale
  lastNames: NamesLast
  sexes:
  - Unsexed

- type: metabolizerType
  id: Android
  name: metabolizer-type-android

- type: entity
  id: AndroidCore
  parent: [BaseItem, OrganHumanBrain]
  name: android core
  description: "The source of incredible, unending gooeyness."
  components:
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      layers:
        - state: cpu_super
    - type: StaticPrice
      price: 1750
    - type: Stomach
    - type: Metabolizer
      maxReagents: 6
      metabolizerTypes: [ Android ]
      removeEmpty: true
      groups:
        - id: Food
        - id: Drink
        - id: Medicine
        - id: Poison
        - id: Narcotic
        - id: Alcohol
          rateModifier: 0.25
    - type: SolutionContainerManager
      solutions:
        stomach:
          maxVol: 50.0
        food:
          maxVol: 5
          reagents:
          - ReagentId: GreyMatter
            Quantity: 5
        organ:
          reagents:
          - ReagentId: AndroidBlood
            Quantity: 10

- type: entity
  save: false
  parent: [BaseSpeciesMob, AppearanceAndroid, MobBloodstream]
  id: BaseMobMechanic
  abstract: true
  components:
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: AndroidBlood
        Quantity: 150
    bloodlossDamage:
      types:
        Bloodloss: 0.2
    bloodlossHealDamage:
      types:
        Bloodloss: -1.2
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown
    - SlowedDown
    - Flashed
  - type: DamageVisuals
    thresholds: [ 10, 20, 30, 50, 70, 100 ]
    targetLayers:
    - "enum.HumanoidVisualLayers.Chest"
    - "enum.HumanoidVisualLayers.Head"
    - "enum.HumanoidVisualLayers.LArm"
    - "enum.HumanoidVisualLayers.LLeg"
    - "enum.HumanoidVisualLayers.RArm"
    - "enum.HumanoidVisualLayers.RLeg"
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#4d7ee7"
  - type: Reactive
    groups:
      Acidic: [Touch]
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
    showOverlays: false
    allowRevives: true
  - type: ZombieImmune
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSecurityCyborg
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
    - Common
  - type: ActiveRadio
    channels:
    - Binary
    - Common
  - type: HealthExaminable
    examinableTypes:
      - Blunt
      - Slash
      - Piercing
      - Heat
      - Shock
    locPrefix: silicon
  - type: MeleeWeapon
    hidden: true
    soundHit:
      collection: MetalThud
    damage:
      groups:
        Brute: 10
  - type: Prying
    speedModifier: 1.5
    useSound: /Audio/Effects/metal_scrape2.ogg
  - type: UserInterface
    interfaces:
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
        requireInputValidation: false
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: ContainerContainer
    containers:
      borg_brain: !type:ContainerSlot { }
  - type: SiliconLawBound
  - type: ActionGrant
    actions:
    - ActionViewLaws
  - type: SiliconLawProvider
    laws: NTDefault
  - type: EmagSiliconLaw
    stunTime: 5
  - type: IonStormTarget
    chance: 1
  - type: ContainerFill
    containers:
      borg_brain:
      - AndroidCore
  - type: Damageable
    damageContainer: Silicon
  - type: InteractionPopup
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
  - type: Vocal
    sounds:
      Unsexed: UnisexSilicon
      Male: UnisexSilicon
      Female: UnisexSilicon
    wilhelmProbability: 0
  - type: UnblockableSpeech
  - type: HumanoidProfile
    species: Human
  - type: WiresPanel
    openingTool: Prying
  - type: ActivatableUIRequiresPanel
  - type: Lock
    locked: true
    unlockOnClick: false
  - type: LockedWiresPanel
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - CanPilot
    - SiliconEmotes
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 4
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers:
        - borg_brain
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Repairable
    fuelCost: 50
    doAfterDelay: 30
  - type: NoSlip
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: StaticPrice
    price: 25000
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: AccessReader
    access: [["Command"], ["Research"]]
  - type: Access
    groups:
    - AllAccess
  - type: ShowHealthBars
  - type: ShowHealthIcons
  - type: ShowJobIcons
  - type: ShowMindShieldIcons

- type: entity
  save: false
  parent: BaseMobMechanic
  id: MobMechanic
  name: Android
  suffix: Crook, NanoTrasen

- type: entity
  save: false
  parent: BaseMobMechanic
  id: MobMechanicSyndicate
  name: Android
  suffix: Crook, Syndicate
  components:
  - type: Prying
    speedModifier: 1.5
    pryPowered: true
    useSound: /Audio/Effects/metal_scrape2.ogg
  - type: Repairable
    fuelCost: 50
    doAfterDelay: 15
  - type: TypingIndicator
    proto: syndibot
  - type: Speech
    speechSounds: SyndieBorg
    allowedEmotes:
    - Laugh
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Imperial/Seriozha/SCP/doc.ogg
  - type: MeleeWeapon
    hidden: true
    soundHit:
      collection: MetalThud
    damage:
      groups:
        Brute: 12
  - type: Vocal
    sounds:
      Unsexed: UnisexSiliconSyndicate
      Male: UnisexSiliconSyndicate
      Female: UnisexSiliconSyndicate
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: Access
    groups: []
    tags:
    - NuclearOperative
    - SyndicateAgent
  - type: AccessReader
    access: [["SyndicateAgent"], ["NuclearOperative"]]
  - type: SiliconLawProvider
    laws: SyndicateStatic
  - type: IntrinsicRadioTransmitter
    channels:
    - Syndicate
  - type: ActiveRadio
    channels:
    - Syndicate
  - type: ShowSyndicateIcons

