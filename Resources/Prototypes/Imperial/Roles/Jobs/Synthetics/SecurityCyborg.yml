- type: entity
  id: BorgChassisSecurity
  parent: BorgChassisSelectable
  name: security cyborg
  components:
  - type: BorgSwitchableType
    selectedBorgType: security
  - type: Body
    prototype: ImperialBorg


# Security borg
- type: borgType
  id: security

  # Description
  dummyPrototype: BorgChassisSecurity

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleSecurityImperial

  defaultModules:
  - BorgModuleJawsSecurity
  - BorgModuleNonLethalSecurity
  - BorgModuleLethalSecurity

  addComponents:
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons
  - type: FlashImmunity
  - type: CriminalRecordsConsole
  - type: Stripping
  - type: SurveillanceCameraMonitor
  - type: UserInterface
    interfaces:
      enum.CriminalRecordsConsoleKey.Key:
        type: CriminalRecordsConsoleBoundUserInterface
      enum.SurveillanceCameraMonitorUiKey.Key:
        type: SurveillanceCameraMonitorBoundUserInterface
  - type: IntrinsicUI
    uis:
      enum.CriminalRecordsConsoleKey.Key:
        toggleAction: ActionShowStationRecords
      enum.SurveillanceCameraMonitorUiKey.Key:
        toggleAction: ActionShowCameraMonitor
  - type: MobThresholds
    thresholds:
     0: Alive
     150: Critical
     200: Dead

  radioChannels:
  - Security
  - Science

  # Visual
  inventoryTemplateId: borgTall
  spriteBodyState: security
  spriteHasMindState: security_e
  spriteNoMindState: security_e_r
  spriteToggleLightState: security_l

  # Pet
  petSuccessString: petting-success-security-cyborg
  petFailureString: petting-failure-security-cyborg

  # Sounds
  footstepCollection:
    collection: FootstepSecurityCyborg


- type: Tag
  id: BorgModuleSecurityImperial


- type: soundCollection
  id: FootstepSecurityCyborg
  files:
  - /Audio/Imperial/Synthetics/sound_misc_step_step_robo_1.ogg
  - /Audio/Imperial/Synthetics/sound_misc_step_step_robo_2.ogg
  - /Audio/Imperial/Synthetics/sound_misc_step_step_robo_3.ogg

- type: body
  id: ImperialBorg # Тело для киборгов Империала, чтобы у них была рука
  name: "Imperial borg"
  root: torso
  slots:
    torso:
      part: TorsoAnimal
      connections:
      - hand
    hand:
      part: HandsAnimal
