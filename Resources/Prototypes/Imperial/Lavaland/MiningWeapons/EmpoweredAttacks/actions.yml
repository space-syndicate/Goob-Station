- type: entity
  parent: BaseAction
  id: ActionEnhancedShot
  name: Enhanced shot
  description: locale
  components:
  - type: Action
    useDelay: 3
    itemIconStyle: BigAction
    checkCanAccess: false
    repeat: false
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: blink
  - type: TargetAction
    range: 60
  - type: WorldTargetAction
    event: !type:EnhancedShotEvent

