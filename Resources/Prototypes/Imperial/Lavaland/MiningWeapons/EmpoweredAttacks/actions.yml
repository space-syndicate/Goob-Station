  - type: Action
    useDelay: 60
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: blink
  - type: TargetAction
    range: 30
  - type: WorldTargetAction
    event: !type:PiercingLungeEvent

- type: entity
  parent: BaseAction
  id: ActionEarthshakerStrike
  name: Earthshaker strike
  description: locale
  components:
  - type: Action
    useDelay: 60
    icon: { sprite: Structures/Specific/anomaly.rsi, state: anom1 }
  - type: InstantAction
    event: !type:EarthshakerStrikeEvent
