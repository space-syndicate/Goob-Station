  description: NDA-207 — это коробка, содержащая 24 бутылки Coca-Cola той же марки. Бутылки промаркированы от NDA-207-A до -X. В настоящее время только NDA-207-B предназначена для исследований; открытие других бутылок без разрешения сотрудника уровня 4 запрещено
