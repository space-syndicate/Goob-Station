#Амнезиаки
- type: reagent
  id : amnesiacA
  name: Амнезиак класса А
  group: Medicine
  desc: Амнезиак программируемого типа, используется для удаления недавних воспоминаний, период удаляемых воспоминаний можно настроить в пределах от 30 (тридцати) минут до 2 (двух) суток. Вводится в организм путем внутримышечных инъекций.
  physicalDesc: Имеется подпись - "А"
  color: "#00FFFF"
  metabolisms:
    Medicine:
      effects:
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages: [ "Вы забываете все что происходило за последний день" ]
        probability: 1

- type: reagent
  id : amnesiacOmega
  name: Амнезиак класса Омега
  group: Medicine
  desc: Специальная версия амнезиака класса B, вводится сотрудникам Фонда NDA в случае нарушения ими надлежащего режима секретности тем или иным путем. Амнезиак полностью уничтожает все воспоминания о существовании Фонда NDA в целом, равно как и о существовании отдельных его аспектов в частности. Также амнезиаком этого типа обрабатываются все кандидаты на трудоустройство, если они не принимают условия трудового договора с Организацией или же не сдают экзамен после прохождения испытательного срока. Форма выпуска идентична таковой у амнезиака класса В.
  physicalDesc: Имеется подпись - Омега
  flavor: sweet
  color: "#87CEEB"
  metabolisms:
    Medicine:
      effects:
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages: [ "Вы забываете о фонде NDA и все что с ним связано" ]
        probability: 1

- type: reagent
  id : mnestic
  name: Амнестик
  group: Medicine
  desc: Защита от антимеметических и прочих аномалий, воздействующих на память
  physicalDesc: Имеется подпись - Амнестик
  flavor: sweet
  color: "#60008F"
  metabolisms:
    Medicine:
      effects:
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages: [ "Вы чувствуете что ничего не можите забыть." ]
        probability: 1

