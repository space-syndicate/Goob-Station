  announcementMessage: "Мобильная оперативная группа Эпсилон-11, кодовое имя «Девятихвостая лиса», вошла в комплекс. Всем оставшимся в живых рекомендуется оставаться в убежищах для эвакуации или других безопасных зонах до тех пор, пока подразделение не возьмет объект под контроль. Эвакуация начнется после повторной постановки на содержание NDA-объектов."
