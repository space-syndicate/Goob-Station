# glowing crayons

- type: entity
  abstract: true
  parent: Crayon
  id: CrayonGlowing
  description: A colourful crayon, glowing crayon. Looks tastier, than the original. Mmmm...
  components:
  - type: Edible
  - type: FlavorProfile
    flavors:
    - horrible
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Radium
          Quantity: 1
  - type: StaticPrice
    price: 25
  - type: PointLight
    enabled: true
    radius: 1.5
    energy: 2
  - type: LightFade
    duration: 1200 # 20 minutes

# monocolor crayons

- type: entity
  parent: CrayonGlowing
  id: CrayonWhiteGlowing
  name: glowing white crayon
  components:
  - type: Sprite
    state: white
  - type: Item
    heldPrefix: glowing white
  - type: Crayon
    color: white
    glows: true
  - type: PointLight
    color: white
  - type: Tag
    tags:
    - Write
    - Crayon
    - CrayonWhiteGlowing
    - Recyclable
    - Trash

