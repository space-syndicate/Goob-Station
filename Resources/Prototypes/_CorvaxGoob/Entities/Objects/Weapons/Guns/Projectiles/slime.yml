- type: entity
  abstract: true
  id: BulletReagentSlimeBase
  name: reagent spit
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Caustic: 3
    soundHit:
      path: /Audio/Items/hypospray.ogg
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/xeno_toxic.rsi
    layers:
    - state: xeno_toxic
  - type: Ammo
    muzzleFlash: null
  - type: SolutionInjectOnProjectileHit
    transferAmount: 6
    solution: ammo

- type: entity
  id: BulletReagentSlimeNocturine
  parent: BulletReagentSlimeBase
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionContainerManager
    solutions:
      ammo:
        maxVol: 6
        reagents:
        - ReagentId: Nocturine
          Quantity: 6

