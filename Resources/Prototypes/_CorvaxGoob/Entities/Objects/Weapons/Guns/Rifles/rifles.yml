- type: entity
  name: Expansion
  parent: WeaponRifleLecter
  id: WeaponRifleExpansion
  description: An experimental DMR developed by NanoTrasen. Equipped with a laser sight that uses a lens made of bluespace crystals.Feeds from .20 Rifle magazines.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/estoc.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 1
    projectileSpeed: 60
  - type: ChamberMagazineAmmoProvider
    autoCycle: false
    canRack: true
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: CursorOffsetRequiresWield
  - type: LaserPointer
    targetedColor: "#1df5ad"
    defaultColor: "#662eff"
  - type: EyeCursorOffset
    maxOffset: 4
    pvsIncrease: 0.4
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true