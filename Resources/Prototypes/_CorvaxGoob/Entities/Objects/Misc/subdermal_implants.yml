- type: entity
  parent: BaseSubdermalImplant
  id: SkillsImplant
  name: skills implant
  description: This implant will grant all skills.
  categories: [ HideSpawnMenu ]
  components:
   - type: SubdermalImplant
     permanent: true
   - type: Tag
     tags:
       - Skills

- type: entity
  parent: BaseSubdermalImplant
  id: TricordrazineCellImplant
  name: tricordrazine cell implant
  description: This implant gives the user a mild boost to regeneration by infusion of cells with tricordrazine.
  categories: [ HideSpawnMenu ]
  components:
  - type: StypticStimulatorImplant
    executionDelay: 1
    bleedingModifier: 0
    damageModifier:
      types:
        Asphyxiation: 0
        Bloodloss: 0
        Blunt: -0.3
        Slash: -0.3
        Piercing: -0.3
        Heat: -0.5
        Cold: -0.5
        Shock: -0.5