- type: entity
  abstract: true
  id: ReagentSlimeRangedBase
  components:
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1.0
    rechargeSound:
      collection: FootstepSlime
  - type: Gun
    fireRate: 0.5
    useKey: false
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      collection: desecration
  - type: CustomShader
    shader: Aura
  - type: PassiveDamage
    allowedStates:
    - Alive
    damageCap: 100
    damage:
      types:
        Blunt: -0.5
        Slash: -0.5
        Piercing: -0.5
        Poison: -0.5
        Heat: -0.5
        Cold: -0.5
        Shock: -0.5
        Radiation: -0.5
        Caustic: -0.5
        Bloodloss: -0.5
        Asphyxiation: -0.5
  - type: PressureImmunity
  - type: SpecialHighTempImmunity
  - type: SpecialLowTempImmunity

