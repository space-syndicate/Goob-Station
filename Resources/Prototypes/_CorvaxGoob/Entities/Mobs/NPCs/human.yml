- type: entity
  name: syndicate smuggler
  parent: BaseMobHuman
  id: MobSyndicateSmuggler
  components:
    - type: RandomHumanoidAppearance
      randomizeName: false
    - type: NpcFactionMember
      factions:
        - Syndicate
    - type: Loadout
      prototypes:
        - SyndicateSmugglerGear
        - SyndicateSmugglerMedicGear
        - SyndicateSmugglerSoldierGear
        - SyndicateSmugglerMinerGear
        - SyndicateSmugglerEngiGear
        - SyndicateSmugglerSpyGear
      roleLoadout: [ RoleSurvivalEVA ]
    - type: InputMover
    - type: MobMover
    - type: HTN
      rootTask:
        task: SimpleHumanoidHostileCompound
    - type: RandomMetadata
      nameSegments:
      - NamesFakeHumanFirst
      - CorvaxNamesSyndieSmuggler
      - NamesLast
      nameFormat: name-format-smuggler
    - type: GhostTakeoverAvailable
    - type: GhostRole
      name: ghost-role-information-syndicate-smuggler-name
      description: ghost-role-information-syndicate-smuggler-description
      rules: ghost-role-information-freeagent-rules
      raffle:
        settings: default

- type: entity
  name: syndicate redspace raider
  parent: MobSyndicateFootsoldierPilot
  id: MobSyndicateRedspaceRaider
  components:
  - type: GhostRole
    name: ghost-role-information-syndicate-redspace-raider-name
    description: ghost-role-information-syndicate-redspace-raider-description
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonistGoob
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: Loadout
    prototypes:
    - SyndicateRedspaceRaiderGear
  - type: AutoImplant
    implants: [ RedspaceLifelineImplant ]