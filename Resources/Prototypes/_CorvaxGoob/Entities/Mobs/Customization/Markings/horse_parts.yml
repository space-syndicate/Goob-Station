- type: marking
  id: HorseEars
  bodyPart: HeadTop
  markingCategory: HeadTop
  speciesRestriction: [Human, Dwarf]
  sponsorOnly: false # Corvax-Sponsors
  coloring:
    default:
      type:
        !type:CategoryColoring
        category: Hair
      fallbackTypes:
        - !type:SkinColoring
    layers:
      ears_horse_inner:
        type:
          !type:SimpleColoring
          color: "#FFFFFF"
  sprites:
  - sprite: _CorvaxGoob/Mobs/Customization/horse_parts.rsi
    state: ears_horse_outer
  - sprite: _CorvaxGoob/Mobs/Customization/horse_parts.rsi
    state: ears_horse_inner

- type: marking
  id: HorseTail
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Human, Dwarf]
  sponsorOnly: false # Corvax-Sponsors
  coloring:
    default:
      type:
        !type:CategoryColoring
        category: Hair
      fallbackTypes:
        - !type:CategoryColoring
          category: FacialHair
        - !type:SkinColoring
  sprites:
    - sprite: _CorvaxGoob/Mobs/Customization/horse_parts.rsi
      state: tail_horse