- type: entity
  parent: [ClothingMaskBreathMedical, BaseSecurityContraband]
  id: ClothingMaskSecurityMedicalRespirator
  name: security medical respirator
  description: A respirator that provides protection against viruses, dust and more.
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Clothing/Masks/securitymedicalrespirator.rsi
  - type: Clothing
    sprite: _CorvaxGoob/Clothing/Masks/securitymedicalrespirator.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
        Caustic: 0.9
  - type: Hailer
    availableModes:
      calm: HailerMessagersCalm
      agressive: HailerMessagersAgressive
    emagedModes:
      emag: HailerMessagersEmag
  - type: HailerDeathSound
    sound:
      path: /Audio/_CorvaxGoob/Misc/hailer_user_death.ogg

- type: entity
  id: ClothingMaskGasSyndicateUnremoveable
  parent: ClothingMaskGasSyndicate
  suffix: Unremoveable
  components:
  - type: Unremoveable
