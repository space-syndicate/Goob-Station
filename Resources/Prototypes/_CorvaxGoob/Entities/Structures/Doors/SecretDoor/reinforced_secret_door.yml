- type: entity
  parent: ReinforcedSecretDoorAssembly
  id: CorvaxGoobReinforcedSecretDoorAssembly
  suffix: CorvaxGoob
  components:
  - type: AlignToNeighborTags
    tags:
    - Wall
    horizontalRotation: 0
    verticalRotation: 90
  - type: Construction
    graph: Girder
    node: reinforcedSecretDoorFrame
  - type: ContainerContainer
    containers:
      battery-container: !type:Container
      board: !type:Container

- type: entity
  parent: ReinforcedSecretDoor
  id: ReinforcedSecretDoorAirlock
  suffix: secret door airlock
  components:
  - type: NavMapDoor
  - type: Construction
    graph: Girder
    node: ReinforcedSecretDoorAirlock
    containers:
    - battery-container
    - board
  - type: ContainerContainer
    containers:
      battery-container: !type:Container
      board: !type:Container
