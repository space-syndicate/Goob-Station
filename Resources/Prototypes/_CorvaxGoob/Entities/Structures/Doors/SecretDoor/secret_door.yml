- type: entity
  parent: BaseSecretDoorAssembly
  id: CorvaxGoobSecretDoorAssembly
  suffix: CorvaxGoob
  components:
  - type: AlignToNeighborTags
    tags:
    - Wall
    horizontalRotation: 0
    verticalRotation: 90
  - type: Construction
    graph: Girder
    node: secretDoorFrame
  - type: ContainerContainer
    containers:
      battery-container: !type:Container
      board: !type:Container

- type: entity
  parent: SolidSecretDoor
  id: SolidSecretDoorAirlock
  suffix: secret door airlock
  components:
  - type: NavMapDoor
  - type: Construction
    graph: Girder
    node: solidSecretDoorAirlock
    containers:
    - battery-container
    - board
  - type: ContainerContainer
    containers:
      battery-container: !type:Container
      board: !type:Container
