- type: entity
  parent: CrateBaseSecure
  id: CrateBaseBluespace
  name: bluespace crate
  description: A large storage container made of a steel alloy and bluespace crystals.
  components:
  - type: CargoSellBlacklist
  - type: Icon
    sprite: _CorvaxGoob/Bluespace/Crates/limited_secure.rsi
  - type: Sprite
    sprite: _CorvaxGoob/Bluespace/Crates/limited_secure.rsi
  - type: TriggerOnOpen
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          BluespaceLifeline:
            min: 1
            max: 1

- type: entity
  parent: CrateBaseBluespace
  id: CrateBluespaceIndustrial
  name: bluespace industrial crate
  components:
  - type: Icon
    sprite: _CorvaxGoob/Bluespace/Crates/industrial_secure.rsi
  - type: Sprite
    sprite: _CorvaxGoob/Bluespace/Crates/industrial_secure.rsi
  - type: AccessReader
    access: [["Engineering"]]

- type: entity
