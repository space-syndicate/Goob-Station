- type: entity
  parent: BaseToilet
  id: PrisonToiletEmpty
  name: prison toilet
  description: We present to your attention the genius of functional urbanism — the toilet-sink. Not very cheap, but cheerful and compact.
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Structures/Furniture/prison_toilet.rsi
  - type: Construction
    graph: PrisonToilet
    node: prisonToilet
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel:
            min: 5
            max: 5
  - type: StaticPrice
    price: 120

- type: entity
  parent: PrisonToiletEmpty
  id: PrisonToiletWater
  suffix: Water
  components:
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 100
      tank:
        maxVol: 500
        reagents:
        - ReagentId: Water
          Quantity: 200

- type: entity
  id: ToiletDirty
  parent: BaseToilet
  name: dirty toilet
  description: The HT-451, a torque rotation-based, waste disposal unit for small matter. This one looks disgustingly dirty.
  suffix: Dirty
  components:
  - type: Construction
    graph: Toilet
    node: dirty
  - type: Sprite
    layers:
    - state: condisposal
      map: [ "enum.DisposalUnitVisualLayers.Unanchored" ]
      color: "#8B7355"   # if Unanchored, it will be still dirty
    - state: disposal
      map: [ "enum.DisposalUnitVisualLayers.Base" ]
      color: "#8B7355" #dirty tint - "говно"
    - state: disposal-charging
      map: [ "enum.DisposalUnitVisualLayers.BaseCharging" ]
    - state: disposal-flush
      map: [ "enum.DisposalUnitVisualLayers.OverlayFlush" ]
    - state: dispover-charge
      map: [ "enum.DisposalUnitVisualLayers.OverlayCharging" ]
    - state: dispover-ready
      map: [ "enum.DisposalUnitVisualLayers.OverlayReady" ]
    - state: dispover-full
      map: [ "enum.DisposalUnitVisualLayers.OverlayFull" ]
    - state: dispover-handle
      map: [ "enum.DisposalUnitVisualLayers.OverlayEngaged" ]
    - map: [ "DoorVisualState.DoorOpen" ]
    - map: [ "SeatVisualState.SeatUp" ]
