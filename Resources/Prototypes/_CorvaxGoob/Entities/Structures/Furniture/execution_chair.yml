- type: entity
  parent: SeatBase
  id: ExecutionChair
  name: execution chair
  description: The most electrifying seat on the station.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
    delay: 3
  - type: Sprite
    sprite: _CorvaxGoob/Structures/Furniture/execution_chair.rsi
    state: execution-chair
    noRot: true
  - type: Strap
    selfUnBuckleDelay: 30
  - type: ApcPowerReceiver
    powerLoad: 1500
    powerDisabled: true
  - type: ExtensionCableReceiver
  - type: DeviceLinkSink
    ports:
    - Toggle
    - On
    - Off
  - type: Electrified
    enabled: false
    usesApcPower: true
    onBump: false
    onAttacked: false
    onHandInteract: false
    onInteractUsing: false
    ignoreInsulation: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel:
            min: 5
            max: 5
  - type: StaticPrice
    price: 75
  - type: ExecutionChair
