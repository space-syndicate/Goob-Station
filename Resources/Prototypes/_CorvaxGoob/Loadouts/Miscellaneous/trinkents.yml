# Lolypops:
- type: loadout
  id: FoodSnackLollypopWrappedTricordrazine
  storage:
    back:
    - FoodSnackLollypopWrappedTricordrazine
  effects:
  - !type:GroupLoadoutEffect
    proto: LollypopTricordrazine

- type: loadoutEffectGroup
  id: LollypopTricordrazine
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:DepartmentTimeRequirement
      department: Medical
      time: 360000 # 100 hours

