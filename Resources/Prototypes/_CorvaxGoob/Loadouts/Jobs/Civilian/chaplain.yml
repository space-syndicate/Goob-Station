# Playtime requirement for NanoTrasen Bible, Codex NanoTrasimus
- type: loadoutEffectGroup
  id: NanoTrasenBibleRequirement
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobCaptain
      time: 2h

