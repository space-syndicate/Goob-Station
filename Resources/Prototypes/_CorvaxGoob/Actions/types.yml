- type: entity
  parent: BaseMentalAction
  id: ToggleNightVisionMental
  name: Toggle Night Vision
  description: Toggles night vision.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    useDelay: 1
    icon:
      sprite: _White/Clothing/Eyes/Goggles/nightvision.rsi
      state: icon
  - type: InstantAction
    event: !type:ToggleNightVisionEvent

- type: entity
  parent: BaseAction
  id: ActionToggleJanicartCleaning
  name: Toggle floor cleaning
  description: Toggles cleaning floor.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Objects/Specific/Janitorial/spray_bottle.rsi
      state: cleaner
  - type: InstantAction
    event: !type:ToggleJanicartCleaningActionEvent
