# слова/фразы, используемые для создания законов ионного шторма
# 99% этого просто взято с tg, с удалением подозрительных частей

# не используем набор прилагательных в верхнем регистре, так как получение "christmas-stealing" в качестве кодового слова синдиката было бы отстойно
- type: localizedDataset # Imperial Space
  id: IonStormAdjectives
  values:
    prefix: ion-storm-dataset-adjective- # Imperial Space
    count: 96 # Imperial Space

# Аллергии должны быть широкими и встречаться где-нибудь на станции для максимального веселья.
- type: localizedDataset # Imperial Space
  id: IonStormAllergies
  values:
    prefix: ion-storm-dataset-allergy- # Imperial Space
    count: 33 # Imperial Space

# Степень тяжести аллергии.
- type: localizedDataset # Imperial Space
  id: IonStormAllergySeverities
  values:
    prefix: ion-storm-dataset-severity- # Imperial Space
    count: 6 # Imperial Space

# Области — конкретные места на станции или за её пределами.
- type: localizedDataset # Imperial Space
  id: IonStormAreas
  values:
    prefix: ion-storm-dataset-area- # Imperial Space
    count: 44 # Imperial Space

# Абстрактные понятия, чтобы обладатель закона сам определял их значение.
- type: localizedDataset # Imperial Space
  id: IonStormConcepts
  values:
    prefix: ion-storm-dataset-concept- # Imperial Space
    count: 53 # Imperial Space

# Экипаж — это конкретная профессия. Используем профессии вместо конкретных членов экипажа,
# так как "КЛОУН" проще, чем выяснять, кто такой Иван Петров.
- type: localizedDataset # Imperial Space
  id: IonStormCrew
  values:
    prefix: ion-storm-dataset-crew- # Imperial Space
    count: 45 # Imperial Space

# только сложные, опасные или смешные напитки, вода не допускается
- type: localizedDataset # Imperial Space
  id: IonStormDrinks
  values:
    prefix: ion-storm-datasetdrink- # Imperial Space
    count: 20 # Imperial Space

- type: localizedDataset # Imperial Space
  id: IonStormFeelings
  values:
    prefix: ion-storm-dataset-feeling- # Imperial Space
    count: 23 # Imperial Space

# loc недостаточно продвинут, чтобы менять has на have и т.д.
- type: localizedDataset # Imperial Space
  id: IonStormFeelingsPlural
  values:
    prefix: ion-storm-dataset-feeling-plural- # Imperial Space
    count: 23 # Imperial Space

# Только сложная, опасная или смешная еда, яблоки не допускаются
- type: localizedDataset # Imperial Space
  id: IonStormFoods
  values:
    prefix: ion-storm-dataset-food- # Imperial Space
    count: 20 # Imperial Space

# "Must" — это забавные вещи, которые обладатель закона или экипаж должны делать.
- type: localizedDataset # Imperial Space
  id: IonStormMusts
  values:
    prefix: ion-storm-dataset-must- # Imperial Space
    count: 94 # Imperial Space

- type: localizedDataset # Imperial Space
  id: IonStormNumberBase
  values:
    prefix: ion-storm-dataset-number-base- # Imperial Space
    count: 17 # Imperial Space

- type: localizedDataset # Imperial Space
  id: IonStormNumberMod
  values:
    prefix: ion-storm-dataset-number-mod- # Imperial Space
    count: 11 # Imperial Space

# Объекты — всё, что можно найти на станции или за её пределами, во множественном числе.
- type: localizedDataset # Imperial Space
  id: IonStormObjects
  values:
    prefix: ion-storm-dataset-object- # Imperial Space
    count: 143 # Imperial Space

# "Requires" — это в основном тупые интернет-мемы.
- type: localizedDataset # Imperial Space
  id: IonStormRequires
  values:
    prefix: ion-storm-dataset-require- # Imperial Space
    count: 109 # Imperial Space

# Конкретные действия, которые либо вредят людям, либо должны выполняться, чтобы не вредить.
# Убедитесь, что они во множественном числе, и "не" можно добавить в начало.
- type: localizedDataset # Imperial Space
  id: IonStormActions
  values:
    prefix: ion-storm-dataset-action- # Imperial Space
    count: 111 # Imperial Space

# Угрозы — обычно плохие вещи, смешные или нет. Во множественном числе.
- type: localizedDataset # Imperial Space
  id: IonStormThreats
  values:
    prefix: ion-storm-dataset-threat- # Imperial Space
    count: 65 # Imperial Space

- type: localizedDataset # Imperial Space
  id: IonStormVerbs
  values:
    prefix: ion-storm-dataset-verb- # Imperial Space
    count: 23 # Imperial Space
