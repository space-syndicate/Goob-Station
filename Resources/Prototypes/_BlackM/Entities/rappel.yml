- type: entity
  parent: BaseItem
  id: BlackMRappelConsole
  name: планшет десантирования
  description: Защищённый полевой планшет с видеоканалом зоны высадки и управлением тросами.
  components:
  - type: Sprite
    sprite: _BlackM/Objects/Devices/rappel_tablet.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _BlackM/Objects/Devices/rappel_tablet.rsi
  - type: RappelConsole
    channel: default
    zoneId: default
    cameraZoom: 1.0
    maxZoom: 1.5
  - type: ActivatableUI
    key: enum.RappelConsoleUiKey.Key
    inHandsOnly: true
    singleUser: true
  - type: ActivatableUIRequiresVision
  - type: UserInterface
    interfaces:
      enum.RappelConsoleUiKey.Key:
        type: RappelConsoleBoundUserInterface

- type: entity
  parent: BlackMRappelConsole
  id: BlackMRappelTablet
  name: планшет десантирования

- type: entity
  parent: MarkerBase
  id: BlackMRappelZoneMarker
  name: зона высадки (маркер)
  components:
  - type: Sprite
    sprite: _BlackM/Markers/rappel_zone.rsi
    layers:
    - state: zone
  - type: RappelZone
    id: default
    radius: 12

- type: entity
  parent: BaseStructure
  id: BlackMRappelRope
  name: десантный трос
  description: Пристегнись и спускайся вниз, как настоящий спецназ.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _BlackM/Structures/rappel_anchor.rsi
    drawdepth: Objects
    layers:
    - state: base
    - state: rope
      map: ["enum.RappelRopeVisualLayers.Rope"]
      visible: false
    - state: light_idle
      map: ["enum.RappelRopeVisualLayers.Light"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RappelRopeVisuals.Linked:
        enum.RappelRopeVisualLayers.Rope:
          True: { visible: true }
          False: { visible: false }
        enum.RappelRopeVisualLayers.Light:
          True: { state: light_linked }
          False: { state: light_idle }
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: RappelRope
    channel: default
    hookDelay: 2.5
    descentTime: 3.5
    ropeDeployTime: 1.2
    throwFlashbang: true
    flashbangCount: 3
    flashbangDistance: 2.5
    dropHeight: 7
    slotSpacing: 1.0
    ceilingCollapse: true
    ceilingCollapseSound:
      path: /Audio/Effects/explosion_small1.ogg
      params:
        volume: -4
        variation: 0.08
    ceilingDebrisCount: 0
    ceilingSmallDebrisCount: 0
    ceilingDustCount: 5
    ceilingDebrisRadius: 1.3

    loopDescentSound: false
    hookSound:
      path: /Audio/Items/Handcuffs/rope_start.ogg
      params:
        volume: -6
        variation: 0.03
    descentSound:
      path: /Audio/Items/zip.ogg
      params:
        volume: -9
        variation: 0.03
    landSound:
      path: /Audio/Effects/thudswoosh.ogg
      params:
        volume: -8
        variation: 0.03
    unhookSound:
      path: /Audio/Items/Handcuffs/rope_end.ogg
      params:
        volume: -9
        variation: 0.03

- type: entity
  id: BlackMRappelActiveRope
  name: спускаемый трос
  components:
  - type: RappelDeployedRope
  - type: Transform
    anchored: false

- type: entity
  id: BlackMRappelRopeDecor
  name: десантный груз
  description: Груз, оставшийся после десантирования. Его можно убрать через контекстное меню.
  placement:
    mode: SnapgridCenter
  components:
  - type: RappelBallast
  - type: Sprite
    sprite: _BlackM/Structures/rappel_ballast.rsi
    drawdepth: Objects
    state: ballast
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: false

- type: entity
  id: BlackMRappelCeilingBreach
  name: обрушение потолка
  categories: [ HideSpawnMenu ]
  components:
  - type: RappelCeilingBreach
    duration: 6
    shakeRadius: 8
    shakeStrength: 0.45
    shakeDuration: 0.8
  - type: Transform
    anchored: false
  - type: PointLight
    radius: 4
    energy: 3
    color: "#ffe9c4"
  - type: TimedDespawn
    lifetime: 6.5

- type: entity
