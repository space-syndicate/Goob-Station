- type: entity
  id: WeaponSubMachineGunBlackMMP5
  parent: [BaseWeaponSubMachineGun, BaseGunWieldable, BaseSecurityContraband]
  name: MP5
  description: A compact submachine gun. Uses .35 Auto SMG magazines.
  components:
  - type: Sprite
    sprite: _BlackM/Objects/Weapons/Guns/SMGs/mp5/big.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _BlackM/Objects/Weapons/Guns/SMGs/mp5/tiny.rsi
    size: Large
  - type: Clothing
    sprite: _BlackM/Objects/Weapons/Guns/SMGs/mp5/tiny.rsi
  - type: Gun
    minAngle: 2
    maxAngle: 16
    angleIncrease: 3
    angleDecay: 16
    fireRate: 8
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
    angleIncrease: 0
    angleDecay: 0

- type: entity
  id: WeaponShotgunBlackMSpas12
  parent: WeaponShotgunEnforcer
  name: SPAS-12
  description: A semi-automatic shotgun. Uses shotgun shells.
  components:
  - type: Sprite
    sprite: _BlackM/Objects/Weapons/Guns/Shotguns/spas_12/big.rsi
  - type: Item
    sprite: _BlackM/Objects/Weapons/Guns/Shotguns/spas_12/tiny.rsi
  - type: Clothing
    sprite: _BlackM/Objects/Weapons/Guns/Shotguns/spas_12/tiny.rsi
