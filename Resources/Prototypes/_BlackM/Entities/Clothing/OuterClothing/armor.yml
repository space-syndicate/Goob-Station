- type: entity
  parent: [ClothingOuterBaseMedium, AllowSuitStorageClothing, BaseSecurityContraband]
  id: ClothingArmorHecuUnit
  name: Бронированный Жилет HECU
  description: Стандартный бронированный жилет HECU, обеспечивающий надёжную защиту от большинства видов урона.
  components:
  - type: Sprite
    sprite: _BlackM/Clothing/OuterClothing/Armor/hecuarmor.rsi
    state: icon
  - type: Clothing
    sprite: _BlackM/Clothing/OuterClothing/Armor/hecuarmor.rsi
  - type: Armor
    coverage:
    - Chest
    - Groin
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.64
        Slash: 0.64
        Piercing: 0.64
        Heat: 0.76
  - type: ExplosionResistance
    damageCoefficient: 0.92
  - type: ModifyDelayedKnockdown
    delayDelta: 2
    knockdownTimeDelta: -2
  - type: StaminaResistance
    damageCoefficient: 0.76

