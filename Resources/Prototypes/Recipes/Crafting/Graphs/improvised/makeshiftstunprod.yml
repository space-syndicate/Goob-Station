- type: constructionGraph
  id: makeshiftstunprod
  start: start
  graph:
    - node: start
      edges:
        - to: msstunprod
          completed:
          - !type:AdminLog
            message: "Construction"
            impact: High
          steps:
            - material: MetalRod
              amount: 1
            - tag: PowerCellSmall
              name: recipes-powercell-small-name
              icon:
                sprite: Objects/Power/power_cells.rsi
                state: small
            - tag: Handcuffs
              icon:
                sprite: Objects/Misc/cablecuffs.rsi
                state: cuff
                color: red
              name: recipes-handcuffs-name
            - tag: Igniter
              name: recipes-igniter-name
              icon:
                sprite: Objects/Devices/igniter.rsi
                state: icon
              doAfter: 15
    - node: msstunprod
      entity: Stunprod

