#
# Mapper markers for mining crates.
# Suffix = spawn chance. EntityTableSpawner NestedSelector.prob is the chance to spawn.
# RandomAny: picks one of three tiers when it does spawn.

# --- Common ---

- type: entity
  parent: MarkerBase
  id: LavalandMiningCrateSpawnerCommon20
  name: mining crate spawner
  suffix: Common, 20%
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Lavaland/Structures/Storage/Crates/mining_crate.rsi
      state: icon
      scale: 0.25, 0.25
  - type: EntityTableSpawner
    offset: 0
    table: !type:NestedSelector
      tableId: LavalandMiningCrateSpawnerCommonTable
      prob: 0.2

- type: entity
  parent: LavalandMiningCrateSpawnerCommon20
  id: LavalandMiningCrateSpawnerCommon50
  suffix: Common, 50%
  components:
  - type: EntityTableSpawner
    offset: 0
    table: !type:NestedSelector
      tableId: LavalandMiningCrateSpawnerCommonTable
      prob: 0.5

- type: entity
  parent: LavalandMiningCrateSpawnerCommon20
  id: LavalandMiningCrateSpawnerCommon100
  suffix: Common, 100%
  components:
  - type: EntityTableSpawner
    offset: 0
    table: !type:NestedSelector
      tableId: LavalandMiningCrateSpawnerCommonTable
      prob: 1

- type: entityTable
  id: LavalandMiningCrateSpawnerCommonTable
  table: !type:GroupSelector
    children:
    - id: LavalandMiningCrateCommon

