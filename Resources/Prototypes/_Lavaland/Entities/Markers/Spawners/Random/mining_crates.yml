# --- Random tier (common / medium / legendary) ---
# Equal weight between tiers when spawn succeeds; outer prob = chance nothing spawns.

- type: entityTable
  id: LavalandMiningCrateSpawnerRandomAnyTable
  table: !type:GroupSelector
    children:
    - id: LavalandMiningCrateCommon
      weight: 1
    - id: LavalandMiningCrateMedium
      weight: 1
    - id: LavalandMiningCrateLegendary
      weight: 1

