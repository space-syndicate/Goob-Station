# Core only + startUnlocked (no payment modules).
- type: entity
  parent: LavalandMiningCrateBase
  id: LavalandMiningCrateEmpty
  name: mining crate
  description: A heavily secured mining crate. Careful, it might be more dangerous than it first appears.
  suffix: Empty
  categories: [ ]
  components:
  - type: Lock
    locked: false
    unlockOnClick: false
    lockOnClick: false
    showLockVerbs: false
    useAccess: false
  - type: MiningCrate
    startUnlocked: true
    spawnLoot: false

# Free timed unlock (timer only, no points).
- type: entity
  parent: LavalandMiningCrateBase
  id: LavalandMiningCrateEmptyLocked
  name: mining crate
  description: A heavily secured mining crate. Careful, it might be more dangerous than it first appears.
  suffix: Empty, Locked
