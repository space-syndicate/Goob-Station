  table: !type:GroupSelector
    children:
    - id: WeaponCrusher
      weight: 2
    - id: WeaponCrusherGlaive
      weight: 2
    - id: WeaponCrusherHammer
      weight: 1.5
    - id: WeaponCrusherHalberd
      weight: 1.5
    - id: WeaponCrusherDagger
      weight: 1.5
    - id: LavalandWeaponKineticMachete
      weight: 1.2
    - id: LavalandWeaponKineticClaws
      weight: 1.2
    # Pre-modded crushers (very rare — already count as several upgrades)
    - id: WeaponCrusherFilledRandom
      weight: 0.15
    - id: WeaponCrusherGlaiveFilledRandom
      weight: 0.15
    - id: WeaponCrusherHammerFilledRandom
      weight: 0.1
    - id: WeaponCrusherHalberdFilledRandom
      weight: 0.1

# Proto-kinetic guns family
