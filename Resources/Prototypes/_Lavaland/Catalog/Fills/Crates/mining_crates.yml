# Lavaland mining crate loot tables.

- type: entityTable
  id: LavalandMiningCrateCigPackPool
  table: !type:GroupSelector
    children:
    - id: CigPackGreen
    - id: CigPackRed
    - id: CigPackBlue
    - id: CigPackBlack

# Premium smokes (rarer)
- type: entityTable
  id: LavalandMiningCrateCigPremiumPool
  table: !type:GroupSelector
    children:
    - id: CigPackSyndicate
      weight: 2
    - id: CigarCase
      weight: 2
    - id: CigarGoldCase
      weight: 1
    - id: CigCartonGreen
      weight: 1.5
    - id: CigCartonRed
      weight: 1.5
    - id: CigCartonBlue
      weight: 1
    - id: CigCartonBlack
      weight: 1

# 3–4 random cigarette packs at once
- type: entityTable
  id: LavalandMiningCrateCigPackBundle
  table: !type:NestedSelector
    rolls: 3, 4
    tableId: LavalandMiningCrateCigPackPool

- type: entityTable
  id: LavalandMiningCrateFoodPool
  table: !type:GroupSelector
    children:
    - id: BoxMRE
      weight: 3
    - id: FoodTinMRE
      weight: 2
    - id: FoodTinBeans
      weight: 2
    - id: FoodSnackNutribrick
      weight: 2
    - id: FoodSnackMREBrownie
      weight: 1.5
    - id: FoodSnackChips
      weight: 1
    - id: FoodSnackChocolate
      weight: 1.2
    - id: FoodSnackEnergy
      weight: 1
    - id: FoodSnackPistachios
      weight: 1
    - id: FoodCabbage
      weight: 1.2
    - id: DrinkWaterBottleFull
      weight: 2

# Beer: loose cans only (no 6-pack). Cola keeps DrinkCanPack.
- type: entityTable
  id: LavalandMiningCrateBeerCans
  table: !type:GroupSelector
    rolls: 3, 6
    children:
    - id: DrinkBeerCan

- type: entityTable
  id: LavalandMiningCrateDrinkPool
  table: !type:GroupSelector
    children:
    - id: DrinkCanPack
      weight: 3
    - !type:NestedSelector
      weight: 3
      tableId: LavalandMiningCrateBeerCans
    - id: DrinkColaCan
      weight: 1
    - id: DrinkBeerCan
      weight: 1.5
    - id: DrinkRootBeerCan
      weight: 1
    # Tunnel whiskey / absinthe bottles
    - id: DrinkWhiskeyBottleFull
      weight: 1.2
    - id: DrinkAbsintheBottleFull
      weight: 1.2

# Salvage staples: fultons, seismic, cells, tanks, boots, kinetic blades, capsules
- type: entityTable
  id: LavalandMiningCrateSeismicBundle
  table: !type:GroupSelector
    children:
    - id: SeismicCharge
      amount: 1, 10

- type: entityTable
  id: LavalandMiningCrateFultonBundle
  table: !type:GroupSelector
    children:
    - id: Fulton1
      amount: 1, 30

- type: entityTable
  id: LavalandMiningCratePowerCellHighBundle
  table: !type:GroupSelector
    children:
    - id: PowerCellHigh
      amount: 1, 3

- type: entityTable
  id: LavalandMiningCrateSalvageGearPool
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      weight: 2
      tableId: LavalandMiningCrateSeismicBundle
    - !type:NestedSelector
      weight: 2
      tableId: LavalandMiningCrateFultonBundle
    - id: FultonBeacon
      weight: 1.8
    - !type:NestedSelector
      weight: 1.8
      tableId: LavalandMiningCratePowerCellHighBundle
    - id: ClothingShoesBootsJack
      weight: 1.5
    - id: DoubleEmergencyOxygenTankFilled
      weight: 1.5
    - id: DoubleEmergencyNitrogenTankFilled
      weight: 1.5
    - id: LavalandWeaponKineticMachete
      weight: 1.5
    - id: WeaponCrusherDagger
      weight: 1.5
    - id: ClothingShoesBootsMoon
      weight: 1.2
    - id: ClothingShoesBootsJump
      weight: 1.2
    - id: ShelterCapsuleLuxury
      weight: 1
    - id: ShelterCapsule
      weight: 1.2
    - id: Fulton
      weight: 1
    - id: SeismicCharge
      weight: 1
    - id: PowerCellHigh
      weight: 1

# One "supply drop" roll: food / drinks / smokes / lighter
- type: entityTable
  id: LavalandMiningCrateSupplyPool
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      weight: 3
      tableId: LavalandMiningCrateFoodPool
    - !type:NestedSelector
      weight: 3
      tableId: LavalandMiningCrateDrinkPool
    - !type:NestedSelector
      weight: 2.5
      tableId: LavalandMiningCrateCigPackBundle
    - !type:NestedSelector
      weight: 0.8
      tableId: LavalandMiningCrateCigPremiumPool
    - id: Lighter
      weight: 1
    - id: CheapLighter
      weight: 1.2

# Guaranteed supplies block for every crate
- type: entityTable
  id: LavalandMiningCrateSuppliesAlways
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      rolls: 2, 3
      tableId: LavalandMiningCrateSupplyPool
    # Extra smokes often
    - !type:NestedSelector
      prob: 0.55
      tableId: LavalandMiningCrateCigPackBundle
    # Extra drinks often
    - !type:GroupSelector
      prob: 0.6
      children:
      - id: DrinkCanPack
      - !type:NestedSelector
        tableId: LavalandMiningCrateBeerCans
    # Extra ration pack often
    - !type:GroupSelector
      prob: 0.5
      children:
      - id: BoxMRE
      - id: FoodTinMRE
      - id: FoodTinBeans
    # Medipens: often 3–4 pens
    - !type:NestedSelector
      prob: 0.55
      tableId: LavalandMiningCrateMedipenBundle
    # Salvage staples sometimes
    - !type:NestedSelector
      prob: 0.4
      tableId: LavalandMiningCrateSalvageGearPool

# Miner gear

# Mining drill: regular or diamond 50/50
- type: entityTable
  id: LavalandMiningCrateDrillPool
  table: !type:GroupSelector
    children:
    - id: MiningDrill
    - id: MiningDrillDiamond

# Conscription kit + drill
- type: entityTable
  id: LavalandMiningCrateMinerKit
  table: !type:AllSelector
    children:
    - id: ClothingBackpackDuffelSalvageConscription
