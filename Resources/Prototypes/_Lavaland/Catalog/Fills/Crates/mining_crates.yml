      weight: 1.5
    - id: MineralScanner
      weight: 1.5
    - id: SurvivalMedipen
      weight: 1.5
    - id: SurvivalKnife
      weight: 1.2
    - id: MedkitBruteFilled
      weight: 1
    - id: MedkitBurnFilled
      weight: 1
    - id: Fulton
      weight: 1
    - id: FultonBeacon
      weight: 0.9
    - id: LavalandJaunter
      weight: 1.2
    - id: ShelterCapsule
      weight: 1
    - id: ShelterCapsuleLuxury
      weight: 0.5
    - id: PowerCellHigh
      weight: 1.2
    - id: SeismicCharge
      weight: 0.8
    - id: BoxMarkerBeacons
      weight: 1
    - id: FlashlightSeclite
      weight: 1
    - id: ClothingEyesGlassesMeson
      weight: 1
    - id: ClothingShoesBootsJack
      weight: 1
    - id: ClothingShoesBootsMoon
      weight: 0.7
    - id: ClothingShoesBootsJump
      weight: 0.7
    - id: DoubleEmergencyOxygenTankFilled
      weight: 1
    - id: DoubleEmergencyNitrogenTankFilled
      weight: 1
    - id: LavalandWeaponKineticMachete
      weight: 1
    - id: WeaponCrusherDagger
      weight: 1
    - !type:NestedSelector
      weight: 1.5
      tableId: LavalandMiningCrateSalvageGearPool
    - !type:NestedSelector
      weight: 0.8
      tableId: LavalandMiningCratePKAUpgradePool
    - !type:NestedSelector
      weight: 0.5
      tableId: LavalandMiningCrateCrusherUpgradePool
    - !type:NestedSelector
      weight: 1.2
      tableId: LavalandMiningCrateMinerKit
    - !type:NestedSelector
      weight: 1.5
      tableId: LavalandMiningCrateDrillPool

# PKA modkits / crusher weapons & upgrades

# All proto-kinetic modkits (pressure rarer — syndicate-tier)
- type: entityTable
  id: LavalandMiningCratePKAUpgradePool
  table: !type:GroupSelector
    children:
    - id: PKAUpgradeDamage
      weight: 2
    - id: PKAUpgradeRange
      weight: 2
    - id: PKAUpgradeFireRate
      weight: 2
    - id: PKAUpgradeSpace
      weight: 1.2
    - id: PKAUpgradePressure
      weight: 0.7

# 1 modkit (rarely 2) — keep crate loot lean
- type: entityTable
  id: LavalandMiningCratePKAUpgradeBundle
  table: !type:NestedSelector
    rolls: 1, 2
    tableId: LavalandMiningCratePKAUpgradePool

# Crusher slot upgrades (main / blade / handle)
- type: entityTable
  id: LavalandMiningCrateCrusherUpgradePool
  table: !type:NestedSelector
    tableId: CrusherUpgrades

# Single crusher upgrade
- type: entityTable
  id: LavalandMiningCrateCrusherUpgradeBundle
  table: !type:NestedSelector
    tableId: CrusherUpgrades

# Melee crushers: axe, glaive, hammer, halberd + secondaries
- type: entityTable
