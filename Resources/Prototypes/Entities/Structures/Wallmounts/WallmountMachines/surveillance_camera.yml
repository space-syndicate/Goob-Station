- type: entity
  abstract: true
  parent: StructureHealthMachineFlimsy # Aquila Change
  id: SurveillanceCameraBase
  name: camera
  description: A surveillance camera. It's watching you. Kinda.
  # Aquila Change start
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  # Aquila Change end
  components:
  # Aquila Change start
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/camera.rsi
    offset: 0, -0.5
    layers:
    - map: [ "enum.SurveillanceCameraVisualsKey.Layer" ]
      state: camera
  - type: Appearance
  # Aquila Change end
  - type: Physics
    bodyType: Static
  # Aquila Change start
  - type: Clickable
  - type: InteractionOutline
  # Aquila Change end
  - type: Fixtures
    fixtures:
      light:
        shape:
          !type:PhysShapeCircle
          radius: 0.5 # Aquila Change
        hard: false
        mask:
        - GhostImpassable
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,-0.2,-0.15"
        density: 190
        mask:
        - None
        layer:
        - TabletopMachineLayer
  - type: Eye # Aquila Change
  - type: PointLight
    enabled: false
    radius: 5
  # Aquila Change start
  - type: Damageable
    damageModifierSet: SteelMod
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds: &ThresholdsSurveilCamera
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -8
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # Aquila Change end
  - type: SlimPoweredLight
    enabled: false
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: WallMount
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: WiresPanel
  - type: Wires
    alwaysRandomize: true
    layoutId: SurveillanceCamera
  # Aquila Change start
  - type: DeviceNetwork
    deviceNetId: Wired
    transmitFrequencyId: SurveillanceCamera
    prefix: device-address-prefix-camera
  - type: DeviceNetworkRequiresPower
  - type: WiredNetworkConnection
  - type: StationAiVision
  - type: Construction
    graph: SurveillanceCamera
    node: camera
  - type: StaticPrice
    price: 200
  # Aquila Change end
  - type: SurveillanceCameraVisuals
    sprites:
      Active: camera
      Disabled: camera_off
      InUse: camera_in_use
  - type: UserInterface
    interfaces:
      enum.SurveillanceCameraSetupUiKey.Camera:
        type: SurveillanceCameraSetupBoundUi
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: SurveillanceCameraBase
  id: SurveillanceCameraConstructed
  name: camera
  suffix: Constructed
  components:
  # Aquila Change start
  - type: SurveillanceCamera
    setupAvailableNetworks:
    - SurveillanceCameraEngineering
    - SurveillanceCameraSecurity
    - SurveillanceCameraService
    - SurveillanceCameraSupply
    - SurveillanceCameraScience
    - SurveillanceCameraGeneral
    - SurveillanceCameraMedical
    - SurveillanceCameraCommand
  # Aquila Change end

